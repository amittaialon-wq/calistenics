<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c111b">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Calisthenics Workout Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&family=Karantina:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: black header band over warm beige paper, cobalt blue for action and muscle highlights */
  --bg:#ece5d7; --card:#f7f2e8; --card-2:#efe8da; --text:#0c111b; --muted:#5f6472; --line:#dcd2bf;
  --accent:#1d48c8; --accent-2:#2f63e6; --accent-soft:#dce3f4; --accent-text:#f7f2e8;
  --ink:#0c111b; --on-ink:#efe8da; --ink-muted:#9aa2b4; --ink-line:#232a38;
  --ok:#1d48c8; --ok-soft:#dce3f4; --danger:#b4232f;
  --sil:#ddd3c0; --m-base:#cbbfa8; --m-pri:#1d48c8; --m-sec:#93abe8;
  --shadow:0 1px 2px rgba(12,17,27,.05),0 6px 18px rgba(60,48,25,.08);
  --font-display:"Karantina","Heebo",system-ui,sans-serif;
  --font-body:"Heebo",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --radius:18px;
  --nav-h:64px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#090c12; --card:#121722; --card-2:#19202e; --text:#ede6d8; --muted:#9ba3b4; --line:#252d3d;
  --accent:#4d7cf6; --accent-2:#6b93ff; --accent-soft:#16213d; --accent-text:#0c111b;
  --ink:#05070b; --on-ink:#ede6d8; --ink-muted:#8b93a5; --ink-line:#1c2230;
  --ok:#4d7cf6; --ok-soft:#16213d; --danger:#f0707a;
  --sil:#1d2433; --m-base:#2b3448; --m-pri:#5b8bff; --m-sec:#33508f;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.4);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#090c12; --card:#121722; --card-2:#19202e; --text:#ede6d8; --muted:#9ba3b4; --line:#252d3d;
  --accent:#4d7cf6; --accent-2:#6b93ff; --accent-soft:#16213d; --accent-text:#0c111b;
  --ink:#05070b; --on-ink:#ede6d8; --ink-muted:#8b93a5; --ink-line:#1c2230;
  --ok:#4d7cf6; --ok-soft:#16213d; --danger:#f0707a;
  --sil:#1d2433; --m-base:#2b3448; --m-pri:#5b8bff; --m-sec:#33508f;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  font-family:var(--font-body);
  background:var(--bg); color:var(--text); line-height:1.5; font-size:16px;
  transition:background .3s,color .3s;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 24px);
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
h1,h2,h3,p{margin:0}
.wrap{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Header */
.app-head{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--ink);color:var(--on-ink);border-bottom:3px solid var(--accent)}
.app-head .wrap{display:flex;align-items:center;gap:10px;height:60px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:700;font-size:36px;line-height:1;letter-spacing:.5px;flex:1;min-width:0;padding-top:4px}
.logo-mark{width:34px;height:34px;border-radius:10px;background:var(--accent);display:grid;place-items:center;color:var(--on-ink);flex:none}
.logo span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.streak{display:flex;align-items:center;gap:4px;padding:6px 12px;border-radius:999px;background:var(--ink-line);color:var(--on-ink);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);transition:transform .15s}
.app-head .icon-btn{background:var(--ink-line);border-color:var(--ink-line);color:var(--on-ink)}
.icon-btn:active{transform:scale(.92)}
.icon-btn svg{width:20px;height:20px}

/* Cards / sections */
.section{margin-top:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.card + .card{margin-top:12px}
.sec-title{font-size:13px;font-weight:700;color:var(--muted);margin:0 2px 8px;letter-spacing:.2px}
.h2{font-family:var(--font-display);font-size:32px;font-weight:700;line-height:1.05;letter-spacing:.3px;text-wrap:balance}

/* Settings */
.field{margin-bottom:16px}
.field:last-of-type{margin-bottom:6px}
.label{font-weight:700;font-size:15px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.label small{font-weight:400;color:var(--muted);font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.grid-2{display:grid;grid-template-columns:1fr 1fr}
.chips.grid-4{display:grid;grid-template-columns:repeat(4,1fr)}
.chip{padding:10px 12px;border-radius:12px;background:var(--card-2);border:1.5px solid var(--line);font-weight:600;font-size:14px;transition:all .18s;text-align:center;line-height:1.25}
.chip small{display:block;font-weight:400;font-size:11.5px;color:var(--muted);margin-top:2px}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.chip.on small{color:var(--ink-muted)}
.chip:active{transform:scale(.96)}
.gen-btn{width:100%;margin-top:14px;padding:16px;border-radius:16px;background:var(--accent);color:var(--accent-text);font-family:var(--font-display);font-weight:700;font-size:30px;line-height:1;letter-spacing:.5px;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 8px 20px color-mix(in srgb,var(--accent) 30%,transparent);transition:transform .15s}
.gen-btn:active{transform:scale(.98)}
.gen-btn svg{width:22px;height:22px}
.gen-btn.spin svg{animation:spin .6s ease}
@keyframes spin{to{transform:rotate(360deg)}}

/* Workout header */
.wk-head{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px}
.wk-top{display:flex;align-items:flex-start;gap:10px}
.wk-title{flex:1;min-width:0}
.wk-title h2{font-family:var(--font-display);font-size:34px;font-weight:700;line-height:1}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pill{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--card-2);border:1px solid var(--line);color:var(--muted);font-weight:500}
.fav-btn.on{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.fav-btn.on svg{fill:var(--accent-2);stroke:var(--accent-2)}
.progress{position:sticky;top:calc(60px + env(safe-area-inset-top,0px));z-index:20;margin-top:8px;display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.bar{flex:1;height:10px;border-radius:99px;background:var(--card-2);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:99px;transition:width .45s cubic-bezier(.2,.8,.2,1)}
.pct{font-family:var(--font-display);font-weight:700;font-size:24px;line-height:1;font-variant-numeric:tabular-nums;min-width:42px;text-align:right}
.wk-actions{display:flex;gap:8px;margin-top:12px}
.btn{padding:10px 14px;border-radius:12px;font-weight:700;font-size:14px;background:var(--card-2);border:1px solid var(--line);display:inline-flex;align-items:center;gap:6px;justify-content:center;transition:transform .15s}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn svg{width:16px;height:16px}
.wk-actions .btn{flex:1}

/* Phase blocks */
.phase{display:flex;align-items:center;gap:8px;margin:24px 2px 10px;font-family:var(--font-display);font-weight:700;font-size:28px;line-height:1}
.phase .em{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--ink);font-size:15px}
.phase small{font-family:var(--font-body);font-weight:500;color:var(--muted);font-size:13px;margin-inline-start:auto}
.check-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line);cursor:pointer;user-select:none}
.check-row:last-child{border-bottom:0;padding-bottom:2px}
.check-row:first-child{padding-top:2px}
.cbox{width:28px;height:28px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;flex:none;transition:all .2s}
.cbox svg{width:16px;height:16px;stroke:var(--accent-text);opacity:0;transform:scale(.4);transition:all .2s}
.check-row.done .cbox{background:var(--ok);border-color:var(--ok)}
.check-row.done .cbox svg{opacity:1;transform:scale(1)}
.check-row.done .cr-name{text-decoration:line-through;color:var(--muted)}
.cr-body{flex:1;min-width:0}
.cr-name{font-weight:700;font-size:15px}
.cr-desc{font-size:13px;color:var(--muted)}
.cr-amt{font-size:12.5px;font-weight:700;color:var(--accent);white-space:nowrap}

/* Exercise card */
.ex{position:relative;overflow:hidden;transition:border-color .3s}
.ex.complete{border-color:var(--ok)}
.ex.complete::after{content:"✓";position:absolute;top:12px;right:12px;width:26px;height:26px;border-radius:50%;background:var(--ok);color:var(--accent-text);display:grid;place-items:center;font-weight:800;font-size:14px;animation:pop .4s ease}
.ex-head{display:flex;align-items:flex-start;gap:10px}
.ex-num{width:34px;height:38px;border-radius:9px;background:var(--ink);color:var(--on-ink);font-family:var(--font-display);font-weight:700;font-size:26px;line-height:1;display:grid;place-items:center;flex:none;padding-top:2px}
.ex-title{flex:1;min-width:0}
.ex-title h3{font-size:17px;font-weight:800;line-height:1.3}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--card-2);color:var(--muted);border:1px solid var(--line)}
.tag.skill{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
.tag.k-strength{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.tag.k-hypertrophy{color:var(--accent);border-color:var(--accent)}
.tag.k-endurance{color:var(--text);border-style:dashed}
.swap-btn{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:700;padding:7px 10px;border-radius:10px;background:var(--card-2);border:1px solid var(--line);flex:none}
.ex.complete .swap-btn{margin-right:30px}
.swap-btn svg{width:15px;height:15px}
.swap-btn:active{transform:scale(.94)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:var(--card-2);border:1px solid var(--line);border-radius:12px;padding:8px 6px;text-align:center}
.stat b{direction:ltr;display:block;font-family:var(--font-display);font-size:28px;font-weight:700;line-height:1;padding-top:2px;font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--muted)}
button.stat{position:relative}
button.stat::after{content:"⏱";position:absolute;top:4px;right:6px;font-size:11px;opacity:.6}
.desc{font-size:14px;color:var(--text);opacity:.85;margin-top:12px}
.muscles{display:grid;grid-template-columns:1fr 150px;gap:10px;align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.mus-line{font-size:13.5px;display:flex;gap:6px;align-items:baseline;line-height:1.45}
.mus-line + .mus-line{margin-top:4px}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block;transform:translateY(1px)}
.dot.pri{background:var(--m-pri)}
.dot.sec{background:var(--m-sec)}
.mus-line .k{color:var(--muted);white-space:nowrap}
.body-svg{width:100%;height:auto;display:block}
.body-svg .sil{fill:var(--sil)}
.body-svg .mb{fill:var(--m-base)}
.body-svg .mp{fill:var(--m-pri)}
.body-svg .ms{fill:var(--m-sec)}
.body-svg ellipse,.body-svg rect,.body-svg polygon{transition:fill .35s}
.body-svg text{fill:var(--muted);font-size:12px;font-family:inherit;text-anchor:middle}
.sets{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.set{flex:1 1 0;min-width:64px;padding:11px 6px;border-radius:12px;border:2px solid var(--line);background:var(--card-2);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:5px;transition:all .2s}
.set svg{width:16px;height:16px;display:none}
.set.done{background:var(--ok);border-color:var(--ok);color:var(--accent-text);animation:pop .35s ease}
.set.done svg{display:block}
@keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.07)}100%{transform:scale(1)}}

/* Summary */
.sum-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:center}
.sum-map{max-width:260px;margin:0 auto;width:100%}
.mchips{display:flex;flex-wrap:wrap;gap:6px}
.mchip{font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:99px;display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--card-2)}
.mchip b{font-size:11px;color:var(--muted)}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin-top:10px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:5px}
.big-num{font-family:var(--font-display);font-size:54px;font-weight:700;line-height:.9;color:var(--accent)}

/* Empty */
.empty{text-align:center;padding:34px 16px;color:var(--muted)}
.empty .em{font-size:44px;margin-bottom:8px}
.empty h3{color:var(--text);font-size:18px;margin-bottom:4px}

/* Animations */
.enter{opacity:0;animation:fadeUp .5s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:var(--d,0ms)}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
.swap-in{animation:swapIn .45s ease}
@keyframes swapIn{0%{opacity:0;transform:rotateX(70deg)}100%{opacity:1;transform:none}}

/* Bottom nav */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:40;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav .wrap{display:flex;height:var(--nav-h)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted);transition:color .2s}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--accent)}
.nav button.on svg{stroke-width:2.6}
.view[hidden]{display:none}

/* Timer */
.timer{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 10px);z-index:45;max-width:656px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:0 16px 40px rgba(0,0,0,.22);padding:14px;transform:translateY(calc(100% + 120px));visibility:hidden;transition:transform .4s cubic-bezier(.2,.8,.2,1),visibility 0s .4s}
.timer.show{transform:none;visibility:visible;transition:transform .4s cubic-bezier(.2,.8,.2,1),visibility 0s}
.timer.ended{border-color:var(--ok)}
.t-inner{display:flex;align-items:center;gap:14px}
.t-ring{position:relative;width:86px;height:86px;flex:none}
.t-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.t-ring circle{fill:none;stroke-width:8}
.t-bg{stroke:var(--card-2)}
.t-fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .25s linear,stroke .3s}
.timer.ended .t-fg{stroke:var(--ok)}
.t-time{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:36px;padding-top:3px;font-variant-numeric:tabular-nums;cursor:pointer}
.t-side{flex:1;min-width:0}
.t-label{font-family:var(--font-display);font-weight:700;font-size:26px;line-height:1.05}
.t-next{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-btns{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.t-btns button{padding:9px 0;border-radius:11px;background:var(--card-2);border:1px solid var(--line);font-weight:700;font-size:14px}
.t-btns button:active{transform:scale(.94)}
.t-close{position:absolute;top:8px;right:10px;width:28px;height:28px;border-radius:8px;color:var(--muted);font-size:18px}
.timer-fab{background:var(--ink)!important;color:var(--on-ink)!important;border-color:var(--ink)!important;position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 14px);z-index:35;width:52px;height:52px;border-radius:50%;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--accent)}
.timer-fab svg{width:24px;height:24px}

/* History / favorites */
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 10px;text-align:center;box-shadow:var(--shadow)}
.kpi b{display:block;font-family:var(--font-display);font-size:40px;font-weight:700;color:var(--accent);line-height:1}
.kpi span{font-size:12px;color:var(--muted)}
.item{display:flex;gap:12px;align-items:center}
.item-ic{width:44px;height:44px;border-radius:12px;background:var(--ink);display:grid;place-items:center;font-size:20px;flex:none}
.item-body{flex:1;min-width:0}
.item-title{font-weight:700;font-size:15px}
.item-sub{font-size:12.5px;color:var(--muted)}
.badge{font-size:12px;font-weight:800;padding:4px 9px;border-radius:99px;background:var(--ok-soft);color:var(--ok);white-space:nowrap}
.badge.part{background:var(--accent-soft);color:var(--accent)}
.list-actions{display:flex;gap:6px}

/* Modal */
.modal{position:fixed;inset:0;z-index:60;background:rgba(5,8,15,.55);display:grid;place-items:center;padding:16px;opacity:0;pointer-events:none;transition:opacity .3s}
.modal.show{opacity:1;pointer-events:auto}
.modal-card{background:var(--card);border-radius:24px;padding:26px 20px 20px;max-width:380px;width:100%;text-align:center;transform:scale(.85) translateY(20px);transition:transform .45s cubic-bezier(.2,1.4,.4,1)}
.modal.show .modal-card{transform:none}
.trophy{font-size:64px;line-height:1;animation:bounce 1.2s ease infinite}
@keyframes bounce{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-10px) rotate(4deg)}}
.modal-card h2{font-family:var(--font-display);font-size:56px;font-weight:700;line-height:1;margin-top:10px;color:var(--accent)}
.modal-card p{color:var(--muted);margin-top:6px}
.modal-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}
.modal-stats div{background:var(--card-2);border-radius:14px;padding:10px 4px}
.modal-stats b{display:block;font-family:var(--font-display);font-size:32px;font-weight:700;line-height:1.05}
.modal-stats span{font-size:11.5px;color:var(--muted)}
.modal-card .btn{width:100%;padding:13px}

.toast{position:fixed;top:calc(72px + env(safe-area-inset-top,0px));left:50%;transform:translate(-50%,-20px);z-index:70;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:all .3s;box-shadow:var(--shadow);max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.ask-card p{color:var(--text);font-size:17px;font-weight:600;margin:0 0 16px}
.ask-card input{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card-2);color:var(--text);font:inherit;font-size:20px;font-weight:700;text-align:center;margin-bottom:16px}
.ask-card input:focus{outline:none;border-color:var(--accent)}
.ask-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ask-btns .btn{padding:13px}
button:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:80}
.note{font-size:13px;color:var(--muted);margin-top:10px;text-align:center}

/* Profile & greeting */
.greet{font-family:var(--font-display);font-size:42px;font-weight:700;line-height:.95;letter-spacing:.3px;text-wrap:balance}
.greet span{color:var(--accent)}
.prof-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:end}
.field-in{display:flex;flex-direction:column;gap:6px;min-width:0}
.field-in>span{font-size:12.5px;font-weight:600;color:var(--muted)}
.field-in input{width:100%;padding:11px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card-2);color:var(--text);font:inherit;font-weight:600}
.field-in input::placeholder{color:var(--muted);font-weight:400}
.field-in input:focus{outline:none;border-color:var(--accent)}
.age-btn{padding:11px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card-2);font-weight:700;min-width:118px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-variant-numeric:tabular-nums}
.age-btn.set{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.age-btn svg{width:14px;height:14px;opacity:.7}
.prof-note{font-size:13px;color:var(--muted);margin-top:10px}
.prof-note b{color:var(--text)}
/* Bottom sheet + age wheel */
.sheet{position:fixed;inset:0;z-index:66;background:rgba(5,8,15,.5);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
.sheet.show{opacity:1;pointer-events:auto}
.sheet-card{width:100%;max-width:520px;background:var(--card);border-radius:22px 22px 0 0;padding-top:8px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));transform:translateY(100%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.sheet.show .sheet-card{transform:none}
.sheet-grip{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 8px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding-bottom:8px;border-bottom:1px solid var(--line)}
.sheet-head b{font-family:var(--font-display);font-size:28px;font-weight:700;line-height:1}
.wheel-wrap{position:relative;height:220px;margin-top:10px}
.wheel{height:220px;overflow-y:scroll;scroll-snap-type:y mandatory;padding-block:88px;perspective:520px;scrollbar-width:none;outline:none;-webkit-mask-image:linear-gradient(transparent,#000 32%,#000 68%,transparent);mask-image:linear-gradient(transparent,#000 32%,#000 68%,transparent)}
.wheel::-webkit-scrollbar{display:none}
.wh-item{height:44px;line-height:44px;text-align:center;scroll-snap-align:center;font-size:22px;font-weight:600;color:var(--muted);cursor:pointer;font-variant-numeric:tabular-nums;user-select:none}
.wh-item.sel{color:var(--text);font-weight:800}
.wheel-hl{position:absolute;left:0;right:0;top:88px;height:44px;border-radius:12px;background:color-mix(in srgb,var(--accent) 10%,transparent);border:1.5px solid color-mix(in srgb,var(--accent) 35%,transparent);pointer-events:none}
.wheel:focus-visible + .wheel-hl{border-color:var(--accent)}
/* Age adaptation card */
.adapt{margin-top:12px;padding:0;overflow:hidden;border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.adapt summary{list-style:none;display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer}
.adapt summary::-webkit-details-marker{display:none}
.adapt-ic{width:42px;height:42px;border-radius:12px;background:var(--accent);color:var(--accent-text);display:grid;place-items:center;flex:none;font-family:var(--font-display);font-size:24px;font-weight:700;padding-top:2px}
.adapt-h{flex:1;min-width:0}
.adapt-h b{display:block;font-family:var(--font-display);font-size:27px;line-height:1;font-weight:700}
.adapt-h small{color:var(--muted);font-size:13px}
.chev{color:var(--muted);transition:transform .2s;font-size:14px}
details[open] .chev{transform:rotate(180deg)}
.adapt ul{list-style:none;margin:0;padding:0 16px 4px}
.adapt li{padding:10px 0;border-top:1px dashed var(--line);display:grid;gap:2px}
.adapt li b{font-size:14.5px}
.adapt li span{font-size:13.5px;color:var(--muted)}
.adapt-safe{margin:4px 16px 14px;padding:10px 12px;border-radius:10px;background:var(--card-2);font-size:12.5px;color:var(--muted)}
.adapt.none{display:flex;align-items:center;gap:12px;padding:14px 16px}
.adapt.none p{font-size:13.5px;color:var(--muted);flex:1;min-width:0}
.adapt.none p b{display:block;color:var(--text);font-size:15px}
/* Demo */
.demo-btn{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--ink);color:var(--on-ink);margin-top:8px}
.demo-btn svg{width:11px;height:11px}
.ex-title h3,.ex .desc{cursor:pointer}
.demo-card{max-width:440px;text-align:left;padding:22px 18px 18px;position:relative;max-height:calc(100% - 24px);overflow:auto}
.demo-card h3{font-family:var(--font-display);font-size:34px;line-height:1;font-weight:700;padding-right:36px;text-wrap:balance}
.demo-card .tags{margin-top:8px}
.demo-stage{position:relative;margin-top:14px;border-radius:16px;background:var(--card-2);border:1px solid var(--line);overflow:hidden}
.demo-stage svg{display:block;width:100%;height:auto}
.demo-stage .pr{stroke:var(--muted);stroke-width:2.2;stroke-linecap:round;fill:none}
.demo-stage .pr.bar{stroke-width:4;stroke:var(--text)}
.demo-stage .pr.wall{stroke-width:3}
.demo-stage .pr.thin{stroke-width:1.2}
.demo-stage .fig line{stroke-width:5.2;stroke-linecap:round}
.demo-stage .near line{stroke:var(--text)}
.demo-stage .near circle{fill:var(--text)}
.demo-stage .far line{stroke:var(--m-sec)}
.demo-phase{position:absolute;top:10px;left:12px;font-size:11.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--accent);transition:opacity .2s}
.cues{list-style:none;padding:0;margin:14px 0 16px;display:grid;gap:9px}
.cues li{display:grid;grid-template-columns:22px 1fr;gap:8px;font-size:14.5px;line-height:1.4;counter-increment:cue}
.cues li::before{content:counter(cue);width:22px;height:22px;border-radius:7px;background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:12px;display:grid;place-items:center}
.yt{width:100%;padding:13px;text-decoration:none}
.yt svg{width:18px;height:18px}
@media (max-width:420px){
  .chips.grid-4{grid-template-columns:repeat(2,1fr)}
  .muscles{grid-template-columns:1fr 128px}
  .sum-grid{grid-template-columns:1fr}
  .logo span{font-size:17px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}

<body>

<script>
'use strict';
document.documentElement.lang = 'en';
document.documentElement.dir = 'ltr';
/* =========================================================
   Utilities & storage
   ========================================================= */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const rand = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fmt = s => { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const dayKey = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
// In-page confirm/prompt (native dialogs are blocked in embedded viewers)
function ask(msg, opts = {}) {
  return new Promise(res => {
    const m = $('#askModal'), inp = $('#askInput'), yes = $('#askYes'), no = $('#askNo');
    $('#askMsg').textContent = msg;
    yes.textContent = opts.yes || 'OK';
    inp.hidden = !opts.input;
    if (opts.input) inp.value = opts.value != null ? opts.value : '';
    m.classList.add('show');
    setTimeout(() => (opts.input ? inp : yes).focus(), 60);
    const done = v => { m.classList.remove('show'); yes.onclick = no.onclick = m.onclick = inp.onkeydown = null; res(v); };
    yes.onclick = () => done(opts.input ? inp.value : true);
    no.onclick = () => done(opts.input ? null : false);
    m.onclick = e => { if (e.target === m) done(opts.input ? null : false); };
    inp.onkeydown = e => { if (e.key === 'Enter') yes.onclick(); };
  });
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* =========================================================
   Static data
   ========================================================= */
const MUSCLES = {
  chest: 'Chest', shoulders: 'Shoulders', rearDelt: 'Rear delts', triceps: 'Triceps',
  biceps: 'Biceps', forearms: 'Forearms', lats: 'Lats', traps: 'Traps',
  rhomboids: 'Upper back', lowerBack: 'Lower back', abs: 'Abs', obliques: 'Obliques',
  hipFlexors: 'Hip flexors', quads: 'Quads', hamstrings: 'Hamstrings', glutes: 'Glutes',
  calves: 'Calves', adductors: 'Adductors'
};
const GOALS = { strength: 'Strength', hypertrophy: 'Hypertrophy', endurance: 'Endurance', mixed: 'Mixed' };
const LEVELS = { 1: 'Beginner', 2: 'Intermediate', 3: 'Advanced', 4: 'Pro' };
const AREAS = {
  upper: { name: 'Upper body', cats: ['push', 'pull'], rot: ['push', 'pull'] },
  push: { name: 'Push', cats: ['push'], rot: ['push'] },
  pull: { name: 'Pull', cats: ['pull'], rot: ['pull'] },
  legs: { name: 'Legs', cats: ['legs'], rot: ['legs'] },
  core: { name: 'Abs & core', cats: ['core'], rot: ['core'] },
  full: { name: 'Full body', cats: ['push', 'pull', 'legs', 'core', 'full'], rot: ['legs', 'push', 'pull', 'core', 'push', 'pull', 'full', 'legs'] }
};
// Prescription per training goal
const SCHEMES = {
  strength:    { name: 'Strength',    reps: '3–6',   hold: '20–30', skillHold: '5–10', rest: 150, work: 30, sets: { 15: 3, 30: 3, 45: 4, 60: 4 } },
  hypertrophy: { name: 'Hypertrophy', reps: '8–12',  hold: '30–45', rest: 75, work: 40, sets: { 15: 3, 30: 3, 45: 4, 60: 4 } },
  endurance:   { name: 'Endurance',   reps: '15–20', hold: '45–60', rest: 40, work: 50, sets: { 15: 2, 30: 3, 45: 3, 60: 4 } }
};

/* Exercise database.
   eq: '' = no equipment; '|' separates alternatives; '+' means all are required.
   t: 'r' reps / 'h' hold (seconds). min/max: suitable level range (1–4).
   Options: f = skill family (progression), s = skill, side = per side, iso = accessory. */
const EX = [];
function E(id, name, cat, eq, min, max, t, pri, sec, desc, o = {}) {
  EX.push(Object.assign({ id, name, cat, eq, min, max, t, pri, sec: sec ? sec.split(',') : [], desc }, o));
}
// ---------- PUSH ----------
E('pushup_knee', 'Knee push-ups', 'push', '', 1, 1, 'r', 'chest', 'triceps,shoulders', 'Body straight from knees to head, hands slightly wider than shoulders. Lower until your chest almost touches the floor, then push back up.');
E('pushup_incline', 'Incline push-ups (hands elevated)', 'push', '', 1, 2, 'r', 'chest', 'triceps,shoulders', 'Hands on a sturdy bench or table. Keep a straight line, elbows about 45° from your body, and lower until your chest nears the surface.');
E('pushup', 'Push-ups', 'push', '', 1, 3, 'r', 'chest', 'triceps,shoulders,abs', 'Hands under shoulders, abs and glutes tight. Lower with control until your chest almost touches the floor and press to full lockout.');
E('pushup_wide', 'Wide push-ups', 'push', '', 1, 3, 'r', 'chest', 'shoulders,triceps', 'Hands well outside shoulder width. Lower slowly with a straight body and feel the stretch in your chest at the bottom.');

const round5 = v => Math.max(5, Math.round(v / 5) * 5);
function scaleRange(r, m) {
  if (m === 1) return r;
  const [a, b] = r.split('–').map(Number);
  const lo = round5(a * m), hi = Math.max(lo + 5, round5(b * m));
  return `${lo}–${hi}`;
}
// Longer rest for older bands, but never past 3:00 (or the goal's own rest if that is longer)
const restFor = (base, band) => band ? Math.min(round5(base * band.restMult), Math.max(base, 180)) : base;

function buildAdapt(s, band, chosenLevel, excluded) {
  const items = [], why = band.why;
  if (s.level < chosenLevel) items.push({ t: `Level ${LEVELS[chosenLevel]} → ${LEVELS[s.level]}`, d: why.level });
  if (excluded) items.push({ t: `${excluded} exercise${excluded > 1 ? 's' : ''} left out`, d: why.excl });
  const keys = s.goal === 'mixed' ? ['strength', 'hypertrophy', 'endurance'] : [s.goal];
  const reps = keys.filter(k => band.reps[k]).map(k => `${SCHEMES[k].name} ${band.reps[k]} (normally ${SCHEMES[k].reps})`);
  if (reps.length) items.push({ t: `Reps: ${reps.join(', ')}`, d: why.reps });
  if (band.setsDelta < 0) items.push({ t: 'One set fewer per exercise', d: why.sets });
  if (band.restMult !== 1) {
    const base = SCHEMES[s.goal === 'mixed' ? 'hypertrophy' : s.goal].rest;
    items.push({ t: `Rest ${fmt(restFor(base, band))} instead of ${fmt(base)}`, d: why.rest });
  }
  if (band.holdMult !== 1) items.push({ t: `Static holds ${Math.round((1 - band.holdMult) * 100)}% shorter`, d: why.hold });
  const base = warmCount(s.duration);
  if (band.warmExtra) items.push({ t: `Warm-up: ${base + band.warmExtra} drills instead of ${base}`, d: why.warm });
  if (band.coolExtra) items.push({ t: `Stretching: ${base + band.coolExtra} stretches instead of ${base}`, d: why.cool });
  if (!items.length) items.push({ t: 'Full program, standard settings', d: why.none });
  return { age: s.age, label: band.label, items, safety: band.safety || '' };
}

   ========================================================= */
function eqOK(eq, avail) {
  if (!eq) return true;
  return eq.split('|').some(g => g === '' || g.split('+').every(x => avail.includes(x)));
}
// Eligible exercises; for each skill family keep only the most advanced stage(s) the level allows
function buildPool(s, cats) {
  const L = s.level, band = bandOf(s), fam = {}, out = [];
  for (const e of EX) {
    if (!cats.includes(e.cat) || e.min > L || !eqOK(e.eq, s.equip)) continue;
    if (band && band.excl(e)) continue;
    if (e.f) (fam[e.f] = fam[e.f] || []).push(e); else out.push(e);
  }
  for (const k in fam) {
    const top = Math.max(...fam[k].map(e => e.min));
    out.push(...fam[k].filter(e => e.min === top));
  }
  return out;
}
const tier = e => e.s ? 0 : e.cat === 'core' ? 3 : e.iso ? 2 : 1;

function pickFrom(cands, chosen, L) {
  const priCount = {};
  chosen.forEach(e => priCount[e.pri] = (priCount[e.pri] || 0) + 1);
  const skills = chosen.filter(e => e.s).length;
  let best = null, bs = -1e9;
  for (const e of cands) {
    let sc = Math.random() * 1.6;
    sc += e.max >= L ? 3 : -(L - e.max) * 1.5;      // prefer level-appropriate
    sc -= (priCount[e.pri] || 0) * 1.2;               // prefer variety of muscles
    if (e.s) sc += L >= 3 ? (skills < 2 ? 1.6 : -0.4) : L === 2 ? 0.3 : 0;
    if (e.iso) sc -= 0.4;
    if (sc > bs) { bs = sc; best = e; }
  }
  return best;
}
function available(pool, chosen, cat) {
  const ids = new Set(chosen.map(e => e.id)), fams = new Set(chosen.map(e => e.f).filter(Boolean));
  return pool.filter(e => (!cat || e.cat === cat) && !ids.has(e.id) && !(e.f && fams.has(e.f)));
}

function setsFor(k, s) {
  const band = bandOf(s);
  let n = SCHEMES[k].sets[s.duration] + (band ? band.setsDelta : 0);
  if (s.level === 1) n--;
  return Math.max(2, n);
}
function prescribe(e, k, s) {
  const key = e.s ? 'strength' : k;          // skills are always trained in a strength scheme
  const sc = SCHEMES[key], band = bandOf(s);
  let val;
  if (e.t === 'h') val = scaleRange(e.s ? sc.skillHold || '5–10' : sc.hold, band ? band.holdMult : 1);
  else val = (!e.s && band && band.reps[key]) || sc.reps;
  return { k: key, sets: setsFor(key, s), val, unit: e.t === 'h' ? 'seconds' : 'reps', rest: restFor(sc.rest, band) };
}
function slotScheme(goal, i, n) {
  if (goal !== 'mixed') return goal;
  const f = i / n;
  return f < 1 / 3 ? 'strength' : f < 2 / 3 ? 'hypertrophy' : 'endurance';
}
const warmCount = d => d <= 15 ? 3 : d >= 60 ? 5 : 4;
const slotSeconds = p => p.sets * SCHEMES[p.k].work + (p.sets - 1) * p.rest + 45;
const warmN = s => warmCount(s.duration) + (bandOf(s) ? bandOf(s).warmExtra : 0);
const coolN = s => warmCount(s.duration) + (bandOf(s) ? bandOf(s).coolExtra : 0);
const mainBudget = s => s.duration * 60 - (warmN(s) + coolN(s)) * 45;

// Age-specific drills (only: […]) come first, so the extra warm-up/stretch slots go to them
function pickList(list, s, count, cardioFirst) {
  const bk = (bandOf(s) || {}).key;
  const ok = list.filter(x => (x.ar[0] === '*' || x.ar.includes(s.area)) && eqOK(x.eq, s.equip)
    && (!x.only || x.only.includes(bk)) && !(x.not && x.not.includes(bk)));
  const first = cardioFirst ? [rand(ok.filter(x => x.cardio))] : [];
  const special = shuffle(ok.filter(x => x.only && !x.cardio));
  const rest = shuffle(ok.filter(x => !x.only && !x.cardio));
  return first.concat(special, rest).slice(0, count).map(x => ({ n: x.n, a: x.a, d: x.d, done: false }));
}

function generate() {
  const band = bandFor(profile.age), chosenLevel = state.s.level;
  const s = Object.assign({}, state.s, { equip: state.s.equip.slice(), age: profile.age || null, level: band ? Math.min(chosenLevel, band.maxLevel) : chosenLevel });
  const L = s.level, area = AREAS[s.area];
  const pool = buildPool(s, area.cats);
  // Fill the time budget (mixed goal estimated with the average of the three schemes)
  const budget = mainBudget(s);
  const chosen = [];
  let used = 0, short = false;
  for (let i = 0; chosen.length < 14 && i < 60; i++) {
    const cat = area.rot[i % area.rot.length];
    let c = available(pool, chosen, cat);
    if (!c.length) c = available(pool, chosen, null);
    if (!c.length) { short = true; break; }
    const e = pickFrom(c, chosen, L);
    const t = s.goal === 'mixed'
      ? ['strength', 'hypertrophy', 'endurance'].reduce((a, k) => a + slotSeconds(prescribe(e, k, s)), 0) / 3
      : slotSeconds(prescribe(e, s.goal, s));
    if (chosen.length >= 2 && used + t > budget * 1.1) break;
    chosen.push(e);
    used += t;
  }
  // Order: skills → compound → accessories → core (stable)
  chosen.sort((a, b) => tier(a) - tier(b));
  const main = chosen.map((e, i) => Object.assign({ id: e.id, done: [] }, prescribe(e, slotScheme(s.goal, i, chosen.length), s)));
  // Small pool (few exercises fit the settings)? Fill the time with extra sets
  let total = main.reduce((a, m) => a + slotSeconds(m), 0);
  for (let g = 0; total < budget * 0.9 && g < 60; g++) {
    const m = main[g % main.length];
    if (m.sets >= 6) continue;
    m.sets++;
    total = main.reduce((a, x) => a + slotSeconds(x), 0);
  }
  main.forEach(m => m.done = Array(m.sets).fill(false));
  // How many exercises the age band removed (among the ones that match area, equipment and level)
  const excluded = band ? EX.filter(e => area.cats.includes(e.cat) && e.min <= L && eqOK(e.eq, s.equip) && band.excl(e)).length : 0;
  state.w = {
    id: uid(), created: Date.now(), s,
    warm: pickList(WARM, s, warmN(s), true),
    main,
    cool: pickList(STRETCH, s, coolN(s), false),
    adapt: band ? buildAdapt(s, band, chosenLevel, excluded) : null,
    logged: false, favId: null, startedAt: null, short: short && total < budget * 0.8
  };
  saveW();
}

function swapExercise(i) {
  const w = state.w, slot = w.main[i], cur = EXM[slot.id];
  const s = w.s;
  const pool = buildPool(s, ['push', 'pull', 'legs', 'core', 'full']);
  const others = w.main.filter((_, j) => j !== i).map(m => EXM[m.id]);
  const cands = available(pool, others, null).filter(e => e.id !== cur.id);
  const tiers = [
    cands.filter(e => e.pri === cur.pri),
    cands.filter(e => e.sec.includes(cur.pri) || cur.sec.includes(e.pri)),
    cands.filter(e => e.cat === cur.cat)
  ];
  const list = tiers.find(t => t.length);
  if (!list) { toast('No suitable replacement found 🤔'); return false; }
  const inRange = list.filter(e => e.max >= s.level);
  const next = rand(inRange.length ? inRange : list);
  const schemeKey = s.goal === 'mixed' ? slotScheme('mixed', i, w.main.length) : s.goal;
  const p = prescribe(next, schemeKey, s);
  w.main[i] = Object.assign({ id: next.id }, p, { done: Array(p.sets).fill(false) });
  saveW();
  return true;
}

const ICON = {

  flag: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>',
  sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>'
};

function totals() {
  const w = state.w;
  if (!w) return { done: 0, total: 0 };
  let done = 0, total = 0;
  w.warm.concat(w.cool).forEach(x => { total++; if (x.done) done++; });
  w.main.forEach(m => m.done.forEach(d => { total++; if (d) done++; }));
  return { done, total };
}
function estMinutes(w) {
  let sec = (w.warm.length + w.cool.length) * 45;
  w.main.forEach(m => { sec += slotSeconds(m); });
  return Math.round(sec / 60);
}
function wName(s) { return `${GOALS[s.goal]} · ${AREAS[s.area].name} · ${s.duration} min`; }

function checkRow(x, phase, i) {
  return `<div class="check-row ${x.done ? 'done' : ''}" data-act="check" data-phase="${phase}" data-i="${i}">
    <div class="cbox">${ICON.check}</div>
    <div class="cr-body"><div class="cr-name">${esc(x.n)}</div><div class="cr-desc">${esc(x.d)}</div></div>
    <div class="cr-amt">${esc(x.a)}</div></div>`;
}

function exCard(m, i, cls = '') {
  const e = EXM[m.id];
  const goal = state.w.s.goal;
  const tags = [];
  if (e.s) tags.push('<span class="tag skill">Skill</span>');
  if (goal === 'mixed' || m.k !== goal) tags.push(`<span class="tag k-${m.k}">${SCHEMES[m.k].name}</span>`);
  tags.push(`<span class="tag">${e.t === 'h' ? 'Static' : 'Dynamic'}</span>`);
  const complete = m.done.every(Boolean);
  const secTxt = e.sec.length ? e.sec.map(x => MUSCLES[x]).join(', ') : '—';
  const sets = m.done.map((d, j) => `<button class="set ${d ? 'done' : ''}" data-act="set" data-i="${i}" data-j="${j}">${ICON.check}Set ${j + 1}</button>`).join('');
  return `<article class="card ex ${complete ? 'complete' : ''} ${cls}" data-card="${i}" style="--d:${120 + i * 70}ms">
    <div class="ex-head">
      <div class="ex-num">${i + 1}</div>
      <div class="ex-title"><h3 data-demo="${i}">${esc(e.name)}</h3><div class="tags">${tags.join('')}</div>
        <button class="demo-btn" data-act="demo" data-i="${i}" type="button"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l12-7.5z"/></svg>Watch demo</button></div>
      <button class="swap-btn" data-act="swap" data-i="${i}" aria-label="Swap exercise">${ICON.swap}Swap</button>
    </div>
    <div class="stats">
      <div class="stat"><b>${m.sets}</b><span>sets</span></div>
      <div class="stat"><b>${m.val}</b><span>${m.unit}${e.side ? ' per side' : ''}</span></div>
      <button class="stat" data-act="rest" data-i="${i}" title="Start rest timer"><b>${fmt(m.rest)}</b><span>rest</span></button>
    </div>
    <p class="desc" data-demo="${i}">${esc(e.desc)}</p>
    <div class="muscles">
      <div>
        <div class="mus-line"><span class="dot pri"></span><span class="k">Primary:</span><b>${MUSCLES[e.pri]}</b></div>
        <div class="mus-line"><span class="dot sec"></span><span class="k">Secondary:</span><span>${secTxt}</span></div>
      </div>
      <div>${bodySVG(new Set([e.pri]), new Set(e.sec))}</div>
    </div>
    <div class="sets">${sets}</div>
  </article>`;
}

function summaryCard() {
  const pri = {}, sec = {};
  state.w.main.forEach(m => {
    const e = EXM[m.id];
    pri[e.pri] = (pri[e.pri] || 0) + 1;
    e.sec.forEach(x => sec[x] = (sec[x] || 0) + 1);
  });
  const priSet = new Set(Object.keys(pri));
  const secSet = new Set(Object.keys(sec).filter(x => !priSet.has(x)));
  const all = new Set([...priSet, ...secSet]);
  const chips = [...priSet].sort((a, b) => pri[b] - pri[a]).map(m => `<span class="mchip"><span class="dot pri"></span>${MUSCLES[m]} <b><bdi dir="ltr">×${pri[m]}</bdi></b></span>`)
    .concat([...secSet].sort((a, b) => sec[b] - sec[a]).map(m => `<span class="mchip"><span class="dot sec"></span>${MUSCLES[m]}</span>`)).join('');
  const missing = Object.keys(MUSCLES).filter(m => !all.has(m)).map(m => MUSCLES[m]);
  return `<div class="card enter" style="--d:${200 + state.w.main.length * 70}ms">
    <div class="h2" style="margin-bottom:12px">📊 Muscle summary</div>
    <div class="sum-grid">
      <div class="sum-map">${bodySVG(priSet, secSet, true)}</div>
      <div>
        <div class="big-num">${all.size}<span style="font-size:16px;color:var(--muted);font-weight:600"> / ${Object.keys(MUSCLES).length}</span></div>
        <div style="color:var(--muted);font-size:13.5px;margin-bottom:10px">muscle groups in this workout</div>
        <div class="mchips">${chips}</div>
      </div>
    </div>
    <div class="legend"><span><span class="dot pri"></span>Primary muscle (exercise count)</span><span><span class="dot sec"></span>Secondary muscle</span></div>
    ${missing.length && missing.length < 10 ? `<p class="note" style="text-align:left">Not trained today: ${missing.join(', ')}</p>` : ''}
  </div>`;
}

function renderWorkout(animate) {
  const el = $('#workout'), w = state.w;
  if (!w) {
    el.innerHTML = `<div class="card empty"><div class="em">🤸‍♂️</div><h3>Ready to train?</h3><p>Pick your settings and tap "Build workout" to get a workout made for you.</p></div>`;
    return;
  }
  const a = animate ? 'enter' : '';
  const isFav = w.favId && state.favs.some(f => f.id === w.favId);
  const t = totals();
  el.innerHTML = `
  <div class="wk-head ${a}">
    <div class="wk-top">
      <div class="wk-title">
        <h2>Your workout</h2>
        <div class="meta">
          <span class="pill">🎯 ${GOALS[w.s.goal]}</span><span class="pill">📈 ${LEVELS[w.s.level]}</span>${w.s.age ? `<span class="pill">🎂 Age ${w.s.age}</span>` : ''}
          <span class="pill">💪 ${AREAS[w.s.area].name}</span><span class="pill">⏱️ ≈${estMinutes(w)} min</span>
        </div>
      </div>
      <button class="icon-btn fav-btn ${isFav ? 'on' : ''}" data-act="fav" aria-label="Save to favorites">${ICON.star}</button>
    </div>
    <div class="wk-actions">
      <button class="btn" data-act="finish">${ICON.flag}Finish workout</button>
    </div>
  </div>
  ${adaptCard(w, a)}
  <div class="progress ${a}"><div class="bar"><i id="pbar"></i></div><div class="pct" id="pct">0%</div></div>
  ${w.short ? `<p class="note">💡 Not enough exercises match your equipment. Try adding equipment or picking another body area.</p>` : ''}
  <div class="phase ${a}" style="--d:60ms"><span class="em">🔥</span>Warm-up<small>${w.warm.length} exercises</small></div>
  <div class="card ${a}" style="--d:90ms">${w.warm.map((x, i) => checkRow(x, 'warm', i)).join('')}</div>
  <div class="phase ${a}" style="--d:110ms"><span class="em">💪</span>Workout<small>${w.main.length} exercises</small></div>
  <div id="mainList">${w.main.map((m, i) => exCard(m, i, a)).join('')}</div>
  <div class="phase ${a}" style="--d:${150 + w.main.length * 70}ms"><span class="em">🧘</span>Stretches<small>${w.cool.length} exercises</small></div>
  <div class="card ${a}" style="--d:${170 + w.main.length * 70}ms">${w.cool.map((x, i) => checkRow(x, 'cool', i)).join('')}</div>
  ${summaryCard().replace('class="card enter"', `class="card ${a}"`)}`;
  updateProgress(t);
}

function adaptCard(w, a) {
  if (!w.adapt) {
    const msg = profile.age
      ? '<b>Built before you set your age</b>Build a new workout to adapt it to age ' + profile.age + '.'
      : '<b>Make it fit your age</b>Set your age and every new workout adapts its exercises, sets, reps, rest and warm-up to you.';
    return `<div class="card adapt none ${a}"><div class="adapt-ic">?</div><p>${msg}</p>${profile.age ? '' : '<button class="btn" data-act="setage" type="button">Set age</button>'}</div>`;
  }
  const ad = w.adapt;
  return `<details class="card adapt ${a}" open>
    <summary><span class="adapt-ic">${ad.age}</span><span class="adapt-h"><b>Adapted for age ${ad.age}</b><small>${esc(ad.label)} · ${ad.items.length} change${ad.items.length > 1 ? 's' : ''}</small></span><span class="chev">▼</span></summary>
    <ul>${ad.items.map(it => `<li><b>${esc(it.t)}</b><span>${esc(it.d)}</span></li>`).join('')}</ul>
    ${ad.safety ? `<p class="adapt-safe">⚠️ ${esc(ad.safety)}</p>` : ''}
  </details>`;
}

function updateProgress(t = totals()) {
  const p = t.total ? Math.round(t.done / t.total * 100) : 0;
  const bar = $('#pbar'), pct = $('#pct');
  if (bar) requestAnimationFrame(() => { bar.style.width = p + '%'; });
  if (pct) pct.textContent = p + '%';
  return p;
}

/* =========================================================
   Interactions – workout
   ========================================================= */
$('#workout').addEventListener('click', async e => {
  const b = e.target.closest('[data-act]');
  if (!b) { const d = e.target.closest('[data-demo]'); if (d && state.w) openDemo(state.w.main[+d.dataset.demo].id); return; }
  if (!state.w) return;
  const w = state.w, act = b.dataset.act;
  if (act === 'set') {
    const i = +b.dataset.i, j = +b.dataset.j, m = w.main[i];
    m.done[j] = !m.done[j];
    if (!w.startedAt) w.startedAt = Date.now();
    b.classList.toggle('done', m.done[j]);
    $(`[data-card="${i}"]`).classList.toggle('complete', m.done.every(Boolean));
    saveW();
    const p = updateProgress();
    if (m.done[j]) {
      if (p >= 100) finishWorkout(true);
      else startTimer(m.rest, nextLabel(i, j));
    }
  } else if (act === 'check') {
    const arr = w[b.dataset.phase], x = arr[+b.dataset.i];
    x.done = !x.done;
    if (!w.startedAt) w.startedAt = Date.now();
    b.classList.toggle('done', x.done);
    saveW();
    if (updateProgress() >= 100 && x.done) finishWorkout(true);
  } else if (act === 'swap') {
    const i = +b.dataset.i;
    if (swapExercise(i)) {
      const old = $(`[data-card="${i}"]`);
      const tmp = document.createElement('div');
      tmp.innerHTML = exCard(w.main[i], i, 'swap-in');
      old.replaceWith(tmp.firstElementChild);
      refreshSummary();
      updateProgress();
      toast('Exercise swapped ✨');
    }
  } else if (act === 'rest') {
    const m = w.main[+b.dataset.i];
    startTimer(m.rest, EXM[m.id].name);
  } else if (act === 'fav') {
    toggleFav(b);
  } else if (act === 'demo') {
    openDemo(w.main[+b.dataset.i].id);
  } else if (act === 'setage') {
    openAgeSheet();
  } else if (act === 'finish') {
    const t = totals();
    if (t.done === 0) { if (await ask('You haven\'t marked any sets yet. Delete this workout?', { yes: 'Delete' })) { state.w = null; saveW(); renderWorkout(); } return; }
    if (await ask('Finish the workout now and save it to your history?', { yes: 'Finish & save' })) finishWorkout(false);
  }
});

function refreshSummary() {
  const cards = $$('#workout > .card');
  const last = cards[cards.length - 1];
  const tmp = document.createElement('div');
  tmp.innerHTML = summaryCard().replace('class="card enter"', 'class="card"');
  last.replaceWith(tmp.firstElementChild);
}

function nextLabel(i, j) {
  const w = state.w, m = w.main[i];
  const nextSet = m.done.findIndex(d => !d);
  if (nextSet !== -1) return `Next: set ${nextSet + 1} · ${EXM[m.id].name}`;
  const nx = w.main.findIndex(mm => mm.done.some(d => !d));
  return nx !== -1 ? `Next: ${EXM[w.main[nx].id].name}` : 'Next: stretches 🧘';
}

function finishWorkout(full) {
  const w = state.w;
  stopTimer();
  const t = totals();
  const pct = t.total ? Math.round(t.done / t.total * 100) : 0;
  const mins = w.startedAt ? Math.max(1, Math.round((Date.now() - w.startedAt) / 60000)) : w.s.duration;
  const setsDone = w.main.reduce((a, m) => a + m.done.filter(Boolean).length, 0);
  if (!w.logged) {
    state.hist.unshift({ id: w.id, date: new Date().toISOString(), goal: w.s.goal, level: w.s.level, area: w.s.area, duration: w.s.duration, actual: mins, pct, exercises: w.main.length });
    store.set('cg.history', state.hist);
    w.logged = true;
    saveW();
  } else {
    const h = state.hist.find(h => h.id === w.id);
    if (h) { h.pct = pct; h.actual = mins; store.set('cg.history', state.hist); }
  }
  renderStreak();
  renderHistory();
  const st = streakInfo();
  $('#doneMsg').textContent = full ? 'You finished the whole workout! Your body thanks you 💪' : `You completed ${pct}% of the workout. Every session counts!`;
  $('#doneStats').innerHTML = `<div><b>${mins}</b><span>minutes</span></div><div><b>${setsDone}</b><span>sets</span></div><div><b>🔥 ${st.cur}</b><span>day streak</span></div>`;
  $('#doneModal').classList.add('show');
  confetti();
  playTone([523, 659, 784, 1047], 0.13);
}
$('#doneClose').addEventListener('click', () => $('#doneModal').classList.remove('show'));
$('#doneModal').addEventListener('click', e => { if (e.target.id === 'doneModal') e.currentTarget.classList.remove('show'); });

/* =========================================================
   Favorites
   ========================================================= */
function toggleFav(btn) {
  const w = state.w;
  const idx = w.favId ? state.favs.findIndex(f => f.id === w.favId) : -1;
  if (idx !== -1) {
    state.favs.splice(idx, 1);
    w.favId = null;
    btn.classList.remove('on');
    toast('Removed from favorites');
  } else {
    const id = uid();
    state.favs.unshift({
      id, name: wName(w.s), savedAt: Date.now(),
      data: {
        s: w.s, adapt: w.adapt || null,
        warm: w.warm.map(x => ({ n: x.n, a: x.a, d: x.d })),
        main: w.main.map(m => ({ id: m.id, k: m.k, sets: m.sets, val: m.val, unit: m.unit, rest: m.rest })),
        cool: w.cool.map(x => ({ n: x.n, a: x.a, d: x.d }))
      }
    });
    w.favId = id;
    btn.classList.add('on');
    btn.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.35) rotate(20deg)' }, { transform: 'scale(1)' }], { duration: 400 });
    toast('Saved to favorites ⭐');
  }
  store.set('cg.favs', state.favs);
  saveW();
  renderFavs();
}
async function loadFav(id) {
  const f = state.favs.find(f => f.id === id);
  if (!f) return;
  if (state.w && !state.w.logged && totals().done > 0 && !(await ask('You have a workout in progress. Replace it with this favorite?', { yes: 'Replace' }))) return;
  const d = f.data;
  state.w = {
    id: uid(), created: Date.now(), s: d.s,
    warm: d.warm.map(x => Object.assign({}, x, { done: false })),
    main: d.main.filter(m => EXM[m.id]).map(m => Object.assign({}, m, { done: Array(m.sets).fill(false) })),
    cool: d.cool.map(x => Object.assign({}, x, { done: false })),
    adapt: d.adapt || null,
    logged: false, favId: f.id, startedAt: null
  };
  saveW();
  switchView('workout');
  renderWorkout(true);
  setTimeout(() => $('#workout').scrollIntoView({ behavior: 'smooth', block: 'start' }), 50);
}
function renderFavs() {
  const el = $('#favList');
  if (!state.favs.length) {
    el.innerHTML = `<div class="card empty"><div class="em">⭐</div><h3>No favorites yet</h3><p>Tap the star on a workout you like to save it here.</p></div>`;
    return;
  }
  el.innerHTML = state.favs.map(f => {
    const names = f.data.main.slice(0, 3).map(m => EXM[m.id] ? EXM[m.id].name : '').filter(Boolean).join(' · ');
    return `<div class="card item">
      <div class="item-ic">⭐</div>
      <div class="item-body">

function streakInfo() {
  const days = new Set(state.hist.map(h => dayKey(new Date(h.date))));
  let cur = 0;
  const d = new Date();
  if (!days.has(dayKey(d))) d.setDate(d.getDate() - 1);
  while (days.has(dayKey(d))) { cur++; d.setDate(d.getDate() - 1); }
  let best = 0, run = 0, prev = null;
  [...days].sort().forEach(k => {
    const dt = new Date(k + 'T12:00:00');
    run = prev && Math.round((dt - prev) / 864e5) === 1 ? run + 1 : 1;
    best = Math.max(best, run);
    prev = dt;
  });
  return { cur, best, days: days.size };
}

/* =========================================================
   Rest timer
   ========================================================= */
const T = { end: 0, total: 0, left: 0, paused: false, iv: null, lastBeep: null, ended: false };
const CIRC = 2 * Math.PI * 42;
function startTimer(sec, next) {
  ensureAudio();
  clearInterval(T.iv);
  Object.assign(T, { total: sec, end: Date.now() + sec * 1000, paused: false, ended: false, lastBeep: null });
  $('#tLabel').textContent = 'Rest';
  $('#tNext').textContent = next || '';
  $('#tPause').textContent = '⏸';
  $('#timer').classList.remove('ended');
  $('#timer').classList.add('show');
  $('#timerFab').style.display = 'none';
  tick();
  T.iv = setInterval(tick, 200);
}
function remaining() { return T.paused ? T.left : Math.max(0, (T.end - Date.now()) / 1000); }
function tick() {
  const left = remaining();
  $('#tTime').textContent = fmt(left);
  $('#tFg').style.strokeDashoffset = CIRC * (1 - (T.total ? left / T.total : 0));
  const s = Math.ceil(left);
  if (!T.paused && s <= 3 && s > 0 && T.lastBeep !== s) { T.lastBeep = s; playTone([660], 0.08, 0.15); }
  if (left <= 0 && !T.ended) {
    T.ended = true;
    clearInterval(T.iv);
    $('#tLabel').textContent = 'Time for the next set! 💪';
    $('#timer').classList.add('ended');
    playTone([880, 880, 1320], 0.22, 0.4);
    try { if (navigator.vibrate) navigator.vibrate([250, 120, 250, 120, 400]); } catch (e) {}
    setTimeout(() => { if (T.ended) stopTimer(); }, 4000);
  }
}
function stopTimer() {
  clearInterval(T.iv);
  T.ended = false;
  $('#timer').classList.remove('show');
  $('#timerFab').style.display = '';
}
function adjustTimer(d) {
  if (T.ended) { startTimer(Math.max(5, d), $('#tNext').textContent); return; }
  if (T.paused) T.left = Math.max(0, T.left + d);
  else T.end = Math.max(Date.now(), T.end + d * 1000);
  T.total = Math.max(T.total, remaining());
  T.lastBeep = null;
  tick();
}
$('#timer').addEventListener('click', e => {
  const b = e.target.closest('[data-t]');
  if (!b) return;
  const a = b.dataset.t;
  if (a === '-15') adjustTimer(-15);
  else if (a === '+15') adjustTimer(15);
  else if (a === 'skip' || a === 'close') stopTimer();
  else if (a === 'pause') {
    if (T.ended) return;
    if (T.paused) { T.end = Date.now() + T.left * 1000; T.paused = false; b.textContent = '⏸'; T.iv = setInterval(tick, 200); }
    else { T.left = remaining(); T.paused = true; b.textContent = '▶'; clearInterval(T.iv); }
    tick();
  }
});

/* Audio */
let actx = null;
function ensureAudio() {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
  } catch (e) {}
}
function playTone(freqs, dur = 0.15, vol = 0.3) {
  ensureAudio();
  if (!actx) return;
  const t0 = actx.currentTime + 0.02;
  freqs.forEach((f, i) => {
    const o = actx.createOscillator(), g = actx.createGain();
    const t = t0 + i * (dur + 0.06);
    o.type = 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t + dur + 0.02);
  });
}
document.addEventListener('pointerdown', ensureAudio, { once: true });

/* =========================================================
   Exercise demos – stick figure driven by joint angles
   Angles in degrees: 0 = pointing down, 90 = forward (right), 180 = up, -90 = back (left).
   A pose sets absolute angles for torso (t, hip→shoulder), upper arm/forearm (ua/la),
   thigh/shin (th/sh); "2" suffix = far-side limb. The figure is pinned by one joint (anchor)
   and, optionally, rotated so a second joint rests on a surface (ground).
   ========================================================= */
const SEG = { T: 30, N: 4, HR: 6.5, UA: 15, FA: 14, TH: 19, SH: 18, FT: 6 };
const FLOOR = 122;
const dirv = a => { const r = a * Math.PI / 180; return [Math.sin(r), Math.cos(r)]; };
const go = (p, a, L) => { const d = dirv(a); return [p[0] + d[0] * L, p[1] + d[1] * L]; };
const ANGLES = ['t', 'hd', 'ua', 'la', 'ua2', 'la2', 'th', 'sh', 'th2', 'sh2', 'ft', 'ft2'];

function fk(P) {
  const hip = [0, 0], sh = go(hip, P.t, SEG.T), head = go(sh, P.hd, SEG.N + SEG.HR);
  const e1 = go(sh, P.ua, SEG.UA), w1 = go(e1, P.la, SEG.FA), e2 = go(sh, P.ua2, SEG.UA), w2 = go(e2, P.la2, SEG.FA);
  const k1 = go(hip, P.th, SEG.TH), f1 = go(k1, P.sh, SEG.SH), t1 = go(f1, P.ft, SEG.FT);
  const k2 = go(hip, P.th2, SEG.TH), f2 = go(k2, P.sh2, SEG.SH), t2 = go(f2, P.ft2, SEG.FT);
  return { hip, sh, head, e1, w1, e2, w2, k1, f1, t1, k2, f2, t2 };
}
function place(P, anchor, at, ground) {
  const pts = fk(P), a0 = pts[anchor];
  for (const k in pts) pts[k] = [pts[k][0] - a0[0] + at[0], pts[k][1] - a0[1] + at[1]];
  if (ground) {
    const v = pts[ground.j], dx = v[0] - at[0], dy = v[1] - at[1];
    let best = 0, err = Infinity;
    for (let i = 0; i <= 240; i++) {               // smallest rotation that puts the joint on the surface
      const r = (i % 2 ? -1 : 1) * Math.ceil(i / 2) * 0.5 * Math.PI / 180;
      const e = Math.abs(at[1] + dx * Math.sin(r) + dy * Math.cos(r) - ground.y);
      if (e < err - 0.05) { err = e; best = r; }
    }
    const c = Math.cos(best), s = Math.sin(best);
    for (const k in pts) {
      const x = pts[k][0] - at[0], y = pts[k][1] - at[1];
      pts[k] = [at[0] + x * c - y * s, at[1] + x * s + y * c];
    }
  }
  return pts;
}
function normPose(p, M) {
  const q = Object.assign({}, p);
  q.anchor = p.anchor || M.anchor;
  q.at = p.at || M.at;
  q.ground = p.ground !== undefined ? p.ground : M.ground;
  q.hd = p.hd ?? p.t;
  q.ua2 = p.ua2 ?? p.ua; q.la2 = p.la2 ?? p.la;
  q.th2 = p.th2 ?? p.th; q.sh2 = p.sh2 ?? p.sh;
  q.ft = p.ft ?? q.sh + 90; q.ft2 = p.ft2 ?? q.sh2 + 90;
  return q;
}
const lerpAng = (a, b, u) => a + ((((b - a) % 360) + 540) % 360 - 180) * u;
function framePts(A, B, u) {
  const P = {};
  for (const k of ANGLES) P[k] = lerpAng(A[k], B[k], u);
  const pa = place(P, A.anchor, A.at, A.ground), pb = place(P, B.anchor, B.at, B.ground);
  for (const k in pa) pa[k] = [pa[k][0] + (pb[k][0] - pa[k][0]) * u, pa[k][1] + (pb[k][1] - pa[k][1]) * u];
  return pa;
}

/* Props (equipment) */
const PROP = {
  floor: () => `<line class="pr" x1="6" y1="${FLOOR}" x2="154" y2="${FLOOR}"/>`,
  bar: (x, y) => `<line class="pr bar" x1="${x - 16}" y1="${y}" x2="${x + 16}" y2="${y}"/>`,
  pbars: (y, x1, x2) => `<line class="pr bar" x1="${x1}" y1="${y}" x2="${x2}" y2="${y}"/><line class="pr" x1="${x1 + 5}" y1="${y}" x2="${x1 + 5}" y2="${FLOOR}"/><line class="pr" x1="${x2 - 5}" y1="${y}" x2="${x2 - 5}" y2="${FLOOR}"/>`,
  wall: x => `<line class="pr wall" x1="${x}" y1="8" x2="${x}" y2="${FLOOR}"/>`,
  box: (x1, y, x2) => `<rect class="pr" x="${x1}" y="${y}" width="${x2 - x1}" height="${FLOOR - y}" rx="2"/>`,
  pole: x => `<line class="pr bar" x1="${x}" y1="4" x2="${x}" y2="${FLOOR}"/>`,
  table: (x1, y, x2) => `<line class="pr bar" x1="${x1}" y1="${y}" x2="${x2}" y2="${y}"/><line class="pr" x1="${x1 + 6}" y1="${y}" x2="${x1 + 6}" y2="${FLOOR}"/><line class="pr" x1="${x2 - 6}" y1="${y}" x2="${x2 - 6}" y2="${FLOOR}"/>`,
  door: x => `<rect class="pr" x="${x}" y="14" width="8" height="${FLOOR - 14}" rx="1"/>`,
  under: (p0, j, hw) => `<rect class="pr" x="${(p0[j][0] - hw).toFixed(1)}" y="${p0[j][1].toFixed(1)}" width="${2 * hw}" height="${(FLOOR - p0[j][1]).toFixed(1)}" rx="2"/>`,
  rings: pts => `<line class="pr thin" x1="${pts.w1[0].toFixed(1)}" y1="2" x2="${pts.w1[0].toFixed(1)}" y2="${pts.w1[1].toFixed(1)}"/><circle class="pr" cx="${pts.w1[0].toFixed(1)}" cy="${pts.w1[1].toFixed(1)}" r="3.6"/>`
};

/* Common poses */
const STAND = { t: 180, ua: 6, la: 6, th: 0, sh: 0 };
const HANG = { t: 178, hd: 160, ua: 186, la: 183, th: 4, sh: -4 };
const PLANK_TOP = { t: 96, ua: 0, la: 0, th: -84, sh: -84 };
const PUSH_BOTTOM = { t: 92, ua: -85, la: 15, th: -88, sh: -88 };

function motion(name, v) {
  const floor = ['floor'];
  switch (name) {
    case 'pushup': {
      const M = { anchor: 'w1', at: [110, FLOOR], ground: { j: 't1', y: FLOOR }, props: [floor], poses: [PLANK_TOP, PUSH_BOTTOM] };
      if (v === 'knee') { M.ground = { j: 'k1', y: FLOOR }; M.poses = [{ ...PLANK_TOP, sh: -150 }, { ...PUSH_BOTTOM, sh: -150 }]; }
      if (v === 'incline') { M.at = [112, 96]; M.props = [floor, ['box', 100, 96, 140]]; }
      if (v === 'decline') { M.ground = { j: 't1', y: 98 }; M.props = [floor, ['under', 't1', 16]]; }
      if (v === 'rings') { M.at = [110, 112]; M.props = [floor, ['rings']]; }
      if (v === 'pseudo') M.poses = [{ ...PLANK_TOP, t: 99, ua: -24, la: -24 }, { ...PUSH_BOTTOM, t: 94, ua: -100, la: -12 }];
      if (v === 'clap') { M.loop = 'cycle'; M.poses = [PLANK_TOP, PUSH_BOTTOM, { ...PLANK_TOP, t: 102, ua: 25, la: 25, at: [114, 110] }]; }
      return M;
    }
    case 'pike': {
      const A = { t: 28, ua: 22, la: 22, th: -28, sh: -28 }, B = { t: 40, ua: 95, la: -20, th: -25, sh: -25 };
      const M = { anchor: 'w1', at: [104, FLOOR], ground: { j: 't1', y: FLOOR }, props: [floor], poses: [A, B] };
      if (v === 'elevated' || v === 'hold') { M.ground = { j: 't1', y: 96 }; M.props = [floor, ['under', 't1', 18]]; }
      if (v === 'hold') M.poses = [A, { ...A, t: 14, ua: 12, la: 12 }];
      return M;
    }
    case 'handstand': {
      const M = { anchor: 'w1', at: [80, FLOOR], props: [floor], poses: [{ t: 28, ua: 22, la: 22, th: -28, sh: -28, ground: { j: 't1', y: FLOOR } }, { t: 0, ua: 0, la: 0, th: 180, sh: 180, ground: null }] };
      if (v === 'wall') M.props.push(['wall', 89]);
      return M;
    }
    case 'hspu': {
      const M = { anchor: 'w1', at: [80, FLOOR], props: [floor], poses: [{ t: 0, ua: 0, la: 0, th: 180, sh: 180 }, { t: 8, ua: 75, la: -30, th: 185, sh: 185 }] };
      if (v === 'wall') M.props.push(['wall', 89]);
      if (v === 'deficit') { M.at = [80, 100]; M.props = [floor, ['pbars', 100, 58, 104], ['wall', 89]]; }
      return M;
    }

  if (!e) return;
  const [mName, variant] = (EX_MOTION[id] || 'squat').split('/');
  const M = motion(mName, variant);
  const poses = M.poses.map(p => normPose(p, M));
  const isHold = e.t === 'h';
  $('#demoTitle').textContent = e.name;
  $('#demoTags').innerHTML = `<span class="tag">${isHold ? 'Static hold' : 'Dynamic'}</span><span class="tag">${MUSCLES[e.pri]}</span>${e.s ? '<span class="tag skill">Skill</span>' : ''}`;
  $('#demoCues').innerHTML = (EX_CUES[id] || MOTION_CUES[mName] || []).slice(0, 3).map(c => `<li>${esc(c)}</li>`).join('');
  $('#demoYt').href = 'https://www.youtube.com/results?search_query=' + encodeURIComponent(e.name + ' calisthenics tutorial');
  $('#demoModal').classList.add('show');

  // Timeline: move between poses with short pauses; pause longer at the end (longest for holds)
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const n = poses.length, idx = M.loop === 'cycle' ? [...poses.keys(), 0] : [...poses.keys(), ...[...poses.keys()].reverse().slice(1)];
  const steps = [];
  idx.forEach((pi, k) => {
    const last = pi === n - 1;
    steps.push({ a: pi, b: pi, dur: reduce ? 1400 : pi === 0 ? 550 : last ? (isHold ? 1700 : 450) : 220, label: pi === 0 ? 'Start' : last ? (isHold ? 'Hold' : 'End') : '' });
    if (k < idx.length - 1) steps.push({ a: pi, b: idx[k + 1], dur: reduce ? 0 : (M.loop === 'cycle' && idx[k + 1] === 0 ? 650 : 850), label: '' });
  });
  const total = steps.reduce((s, x) => s + x.dur, 0);
  const svg = $('#demoSvg'), phase = $('#demoPhase');
  const ease = u => u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
  const t0 = performance.now(), p0 = framePts(poses[0], poses[0], 0);
  cancelAnimationFrame(demoRAF);
  const frame = now => {
    let t = (now - t0) % total, st = steps[0];
    for (const x of steps) { if (t < x.dur) { st = x; break; } t -= x.dur; }
    const u = st.dur ? ease(Math.min(1, t / st.dur)) : 1;
    svg.innerHTML = figureSVG(framePts(poses[st.a], poses[st.b], u), M, p0);
    phase.textContent = st.label;
    phase.style.opacity = st.label ? 1 : 0;
    demoRAF = requestAnimationFrame(frame);
  };
  demoRAF = requestAnimationFrame(frame);
}
function figureSVG(p, M, p0) {
  const f = v => v.toFixed(1);
  const L = (a, b) => `<line x1="${f(a[0])}" y1="${f(a[1])}" x2="${f(b[0])}" y2="${f(b[1])}"/>`;
  const props = (M.props || []).map(pr => pr === 'floor' || pr[0] === 'floor' ? PROP.floor() : pr[0] === 'rings' ? PROP.rings(p) : pr[0] === 'under' ? PROP.under(p0 || p, pr[1], pr[2]) : PROP[pr[0]](...pr.slice(1))).join('');
  return `<g>${props}</g>
    <g class="fig far">${L(p.hip, p.k2)}${L(p.k2, p.f2)}${L(p.f2, p.t2)}${L(p.sh, p.e2)}${L(p.e2, p.w2)}</g>
    <g class="fig near">${L(p.sh, p.head)}${L(p.hip, p.sh)}${L(p.hip, p.k1)}${L(p.k1, p.f1)}${L(p.f1, p.t1)}${L(p.sh, p.e1)}${L(p.e1, p.w1)}<circle cx="${f(p.head[0])}" cy="${f(p.head[1])}" r="${SEG.HR}"/></g>`;
}
function closeDemo() {
  cancelAnimationFrame(demoRAF);
  $('#demoModal').classList.remove('show');
}
$('#demoClose').addEventListener('click', closeDemo);
$('#demoModal').addEventListener('click', e => { if (e.target.id === 'demoModal') closeDemo(); });
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if ($('#demoModal').classList.contains('show')) closeDemo();
  else if ($('#ageSheet').classList.contains('show')) closeAgeSheet(false);
});

/* =========================================================
   Theme, nav, toast, confetti
   ========================================================= */
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  $('#themeBtn').innerHTML = t === 'dark' ? ICON.sun : ICON.moon;
  document.querySelector('meta[name="theme-color"]').content = t === 'dark' ? '#05070b' : '#0c111b';
}
let theme = store.get('cg.theme', null) || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
applyTheme(theme);
$('#themeBtn').addEventListener('click', () => {
  theme = theme === 'dark' ? 'light' : 'dark';
  store.set('cg.theme', theme);
  applyTheme(theme);
  $('#themeBtn').animate([{ transform: 'rotate(-90deg) scale(.6)' }, { transform: 'none' }], { duration: 350, easing: 'ease-out' });
});

function switchView(v) {
  $$('.nav button').forEach(b => b.classList.toggle('on', b.dataset.view === v));
  $$('.view').forEach(s => s.hidden = s.id !== 'view-' + v);
  if (v === 'history') renderHistory();
  if (v === 'favs') renderFavs();
  scrollTo({ top: 0 });
}
$$('.nav button').forEach(b => b.addEventListener('click', () => switchView(b.dataset.view)));

let toastT;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove('show'), 1800);
}

function confetti() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = $('#confetti'), ctx = c.getContext('2d'), dpr = devicePixelRatio || 1;
  const W = innerWidth, H = innerHeight;
  c.width = W * dpr; c.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const colors = ['#1d48c8', '#4d7cf6', '#93abe8', '#0c111b', '#e9dfcb', '#f7f2e8', '#2f63e6'];
  const P = Array.from({ length: 180 }, () => ({
    x: W / 2 + (Math.random() - .5) * 60, y: H * .38,
    vx: (Math.random() - .5) * 16, vy: -Math.random() * 15 - 5,
    s: Math.random() * 7 + 5, r: Math.random() * 6, vr: (Math.random() - .5) * .35,
    c: rand(colors)
  }));
  const t0 = performance.now(), DUR = 3400;
  (function frame(now) {
    const el = now - t0;
    ctx.clearRect(0, 0, W, H);
    for (const p of P) {
      p.vy += .32; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
      ctx.globalAlpha = Math.max(0, 1 - el / DUR);
      ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
      ctx.restore();
    }
    if (el < DUR) requestAnimationFrame(frame); else ctx.clearRect(0, 0, W, H);
  })(t0);
}

/* =========================================================
   Init
   ========================================================= */
if (state.w && (!state.w.main || state.w.main.some(m => !EXM[m.id]))) state.w = null;
renderSettings();
renderProfile();
renderWorkout(false);
renderStreak();
renderHistory();
renderFavs();
</script>
