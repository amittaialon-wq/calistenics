<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff5a1f">
<title>מחולל אימוני קליסתניקס</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f5f9; --card:#ffffff; --card-2:#f8f9fc; --text:#131722; --muted:#6b7280; --line:#e6e8ef;
  --accent:#ff5a1f; --accent-2:#ff9a3d; --accent-soft:#fff0e8; --accent-text:#fff;
  --ok:#16a34a; --ok-soft:#dcfce7;
  --sil:#e4e7ef; --m-base:#cdd2dd; --m-pri:#ef3b3b; --m-sec:#f9a8a8;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 6px 20px rgba(16,24,40,.06);
  --radius:18px;
  --nav-h:64px;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0d1016; --card:#161a23; --card-2:#1c212c; --text:#eef0f6; --muted:#98a1b3; --line:#262c39;
  --accent:#ff6a2b; --accent-2:#ffa24d; --accent-soft:#2b1a11; --accent-text:#fff;
  --ok:#22c55e; --ok-soft:#0f2a1a;
  --sil:#252b38; --m-base:#353d4d; --m-pri:#ff4747; --m-sec:#c47a7d;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  font-family:"Heebo",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  background:var(--bg); color:var(--text); line-height:1.5; font-size:16px;
  transition:background .3s,color .3s;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 24px);
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
h1,h2,h3,p{margin:0}
.wrap{max-width:680px;margin:0 auto;padding:0 16px}

/* Header */
.app-head{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.app-head .wrap{display:flex;align-items:center;gap:10px;height:60px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;flex:1;min-width:0}
.logo-mark{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:grid;place-items:center;color:#fff;flex:none;box-shadow:0 4px 12px color-mix(in srgb,var(--accent) 40%,transparent)}
.logo span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.streak{display:flex;align-items:center;gap:4px;padding:6px 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:14px}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);transition:transform .15s}
.icon-btn:active{transform:scale(.92)}
.icon-btn svg{width:20px;height:20px}

/* Cards / sections */
.section{margin-top:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.card + .card{margin-top:12px}
.sec-title{font-size:13px;font-weight:700;color:var(--muted);margin:0 2px 8px;letter-spacing:.2px}
.h2{font-size:20px;font-weight:800}

/* Settings */
.field{margin-bottom:16px}
.field:last-of-type{margin-bottom:6px}
.label{font-weight:700;font-size:15px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.label small{font-weight:400;color:var(--muted);font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.grid-2{display:grid;grid-template-columns:1fr 1fr}
.chips.grid-4{display:grid;grid-template-columns:repeat(4,1fr)}
.chip{padding:10px 12px;border-radius:12px;background:var(--card-2);border:1.5px solid var(--line);font-weight:600;font-size:14px;transition:all .18s;text-align:center;line-height:1.25}
.chip small{display:block;font-weight:400;font-size:11.5px;color:var(--muted);margin-top:2px}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chip.on small{color:color-mix(in srgb,var(--accent) 75%,var(--text))}
.chip:active{transform:scale(.96)}
.gen-btn{width:100%;margin-top:14px;padding:16px;border-radius:16px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 8px 20px color-mix(in srgb,var(--accent) 35%,transparent);transition:transform .15s}
.gen-btn:active{transform:scale(.98)}
.gen-btn svg{width:22px;height:22px}
.gen-btn.spin svg{animation:spin .6s ease}
@keyframes spin{to{transform:rotate(360deg)}}

/* Workout header */
.wk-head{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px}
.wk-top{display:flex;align-items:flex-start;gap:10px}
.wk-title{flex:1;min-width:0}
.wk-title h2{font-size:18px;font-weight:800}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pill{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--card-2);border:1px solid var(--line);color:var(--muted);font-weight:500}
.fav-btn.on svg{fill:#ffb020;stroke:#ffb020}
.progress{position:sticky;top:60px;z-index:20;margin-top:8px;display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.bar{flex:1;height:10px;border-radius:99px;background:var(--card-2);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:99px;transition:width .45s cubic-bezier(.2,.8,.2,1)}
.pct{font-weight:800;font-size:14px;min-width:42px;text-align:left}
.wk-actions{display:flex;gap:8px;margin-top:12px}
.btn{padding:10px 14px;border-radius:12px;font-weight:700;font-size:14px;background:var(--card-2);border:1px solid var(--line);display:inline-flex;align-items:center;gap:6px;justify-content:center;transition:transform .15s}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{background:transparent}
.btn.danger{color:#e11d48}
.btn svg{width:16px;height:16px}
.wk-actions .btn{flex:1}

/* Phase blocks */
.phase{display:flex;align-items:center;gap:8px;margin:22px 2px 10px;font-weight:800;font-size:16px}
.phase .em{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);font-size:16px}
.phase small{font-weight:500;color:var(--muted);font-size:13px;margin-inline-start:auto}
.check-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line);cursor:pointer;user-select:none}
.check-row:last-child{border-bottom:0;padding-bottom:2px}
.check-row:first-child{padding-top:2px}
.cbox{width:28px;height:28px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;flex:none;transition:all .2s}
.cbox svg{width:16px;height:16px;stroke:#fff;opacity:0;transform:scale(.4);transition:all .2s}
.check-row.done .cbox{background:var(--ok);border-color:var(--ok)}
.check-row.done .cbox svg{opacity:1;transform:scale(1)}
.check-row.done .cr-name{text-decoration:line-through;color:var(--muted)}
.cr-body{flex:1;min-width:0}
.cr-name{font-weight:700;font-size:15px}
.cr-desc{font-size:13px;color:var(--muted)}
.cr-amt{font-size:12.5px;font-weight:700;color:var(--accent);white-space:nowrap}

/* Exercise card */
.ex{position:relative;overflow:hidden;transition:border-color .3s}
.ex.complete{border-color:var(--ok)}
.ex.complete::after{content:"✓";position:absolute;top:12px;left:12px;width:26px;height:26px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px;animation:pop .4s ease}
.ex-head{display:flex;align-items:flex-start;gap:10px}
.ex-num{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;font-weight:800;display:grid;place-items:center;flex:none}
.ex-title{flex:1;min-width:0}
.ex-title h3{font-size:17px;font-weight:800;line-height:1.3}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--card-2);color:var(--muted);border:1px solid var(--line)}
.tag.skill{background:linear-gradient(135deg,#7c3aed,#c026d3);color:#fff;border:0}
.tag.k-strength{color:#dc2626}
.tag.k-hypertrophy{color:#2563eb}
.tag.k-endurance{color:#059669}
.swap-btn{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:700;padding:7px 10px;border-radius:10px;background:var(--card-2);border:1px solid var(--line);flex:none}
.ex.complete .swap-btn{margin-left:30px}
.swap-btn svg{width:15px;height:15px}
.swap-btn:active{transform:scale(.94)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:var(--card-2);border:1px solid var(--line);border-radius:12px;padding:8px 6px;text-align:center}
.stat b{direction:ltr;display:block;font-size:17px;font-weight:800;line-height:1.2}
.stat span{font-size:11.5px;color:var(--muted)}
button.stat{position:relative}
button.stat::after{content:"⏱";position:absolute;top:4px;left:6px;font-size:11px;opacity:.6}
.desc{font-size:14px;color:var(--text);opacity:.85;margin-top:12px}
.muscles{display:grid;grid-template-columns:1fr 150px;gap:10px;align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.mus-line{font-size:13.5px;display:flex;gap:6px;align-items:baseline;line-height:1.45}
.mus-line + .mus-line{margin-top:4px}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block;transform:translateY(1px)}
.dot.pri{background:var(--m-pri)}
.dot.sec{background:var(--m-sec)}
.mus-line .k{color:var(--muted);white-space:nowrap}
.body-svg{width:100%;height:auto;display:block}
.body-svg .sil{fill:var(--sil)}
.body-svg .mb{fill:var(--m-base)}
.body-svg .mp{fill:var(--m-pri)}
.body-svg .ms{fill:var(--m-sec)}
.body-svg ellipse,.body-svg rect,.body-svg polygon{transition:fill .35s}
.body-svg text{fill:var(--muted);font-size:12px;font-family:inherit;text-anchor:middle}
.sets{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.set{flex:1 1 0;min-width:64px;padding:11px 6px;border-radius:12px;border:2px solid var(--line);background:var(--card-2);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:5px;transition:all .2s}
.set svg{width:16px;height:16px;display:none}
.set.done{background:var(--ok);border-color:var(--ok);color:#fff;animation:pop .35s ease}
.set.done svg{display:block}
@keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.07)}100%{transform:scale(1)}}

/* Summary */
.sum-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:center}
.sum-map{max-width:260px;margin:0 auto;width:100%}
.mchips{display:flex;flex-wrap:wrap;gap:6px}
.mchip{font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:99px;display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--card-2)}
.mchip b{font-size:11px;color:var(--muted)}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin-top:10px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:5px}
.big-num{font-size:34px;font-weight:800;line-height:1;color:var(--accent)}

/* Empty */
.empty{text-align:center;padding:34px 16px;color:var(--muted)}
.empty .em{font-size:44px;margin-bottom:8px}
.empty h3{color:var(--text);font-size:18px;margin-bottom:4px}

/* Animations */
.enter{opacity:0;animation:fadeUp .5s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:var(--d,0ms)}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
.swap-in{animation:swapIn .45s ease}
@keyframes swapIn{0%{opacity:0;transform:rotateX(70deg)}100%{opacity:1;transform:none}}

/* Bottom nav */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:40;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav .wrap{display:flex;height:var(--nav-h)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted);transition:color .2s}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--accent)}
.view[hidden]{display:none}

/* Timer */
.timer{position:fixed;left:12px;right:12px;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 10px);z-index:45;max-width:656px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:0 16px 40px rgba(0,0,0,.22);padding:14px;transform:translateY(calc(100% + 120px));visibility:hidden;transition:transform .4s cubic-bezier(.2,.8,.2,1),visibility 0s .4s}
.timer.show{transform:none;visibility:visible;transition:transform .4s cubic-bezier(.2,.8,.2,1),visibility 0s}
.timer.ended{border-color:var(--ok)}
.t-inner{display:flex;align-items:center;gap:14px}
.t-ring{position:relative;width:86px;height:86px;flex:none}
.t-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.t-ring circle{fill:none;stroke-width:8}
.t-bg{stroke:var(--card-2)}
.t-fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .25s linear,stroke .3s}
.timer.ended .t-fg{stroke:var(--ok)}
.t-time{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:22px;font-variant-numeric:tabular-nums;cursor:pointer}
.t-side{flex:1;min-width:0}
.t-label{font-weight:800;font-size:16px}
.t-next{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-btns{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.t-btns button{padding:9px 0;border-radius:11px;background:var(--card-2);border:1px solid var(--line);font-weight:700;font-size:14px}
.t-btns button:active{transform:scale(.94)}
.t-close{position:absolute;top:8px;left:10px;width:28px;height:28px;border-radius:8px;color:var(--muted);font-size:18px}
.timer-fab{position:fixed;left:16px;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 14px);z-index:35;width:52px;height:52px;border-radius:50%;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--accent)}
.timer-fab svg{width:24px;height:24px}

/* History / favorites */
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 10px;text-align:center;box-shadow:var(--shadow)}
.kpi b{display:block;font-size:26px;font-weight:800;color:var(--accent);line-height:1.1}
.kpi span{font-size:12px;color:var(--muted)}
.item{display:flex;gap:12px;align-items:center}
.item-ic{width:44px;height:44px;border-radius:13px;background:var(--accent-soft);display:grid;place-items:center;font-size:20px;flex:none}
.item-body{flex:1;min-width:0}
.item-title{font-weight:700;font-size:15px}
.item-sub{font-size:12.5px;color:var(--muted)}
.badge{font-size:12px;font-weight:800;padding:4px 9px;border-radius:99px;background:var(--ok-soft);color:var(--ok);white-space:nowrap}
.badge.part{background:var(--accent-soft);color:var(--accent)}
.list-actions{display:flex;gap:6px}

/* Modal */
.modal{position:fixed;inset:0;z-index:60;background:rgba(5,8,15,.55);display:grid;place-items:center;padding:16px;opacity:0;pointer-events:none;transition:opacity .3s}
.modal.show{opacity:1;pointer-events:auto}
.modal-card{background:var(--card);border-radius:24px;padding:26px 20px 20px;max-width:380px;width:100%;text-align:center;transform:scale(.85) translateY(20px);transition:transform .45s cubic-bezier(.2,1.4,.4,1)}
.modal.show .modal-card{transform:none}
.trophy{font-size:64px;line-height:1;animation:bounce 1.2s ease infinite}
@keyframes bounce{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-10px) rotate(4deg)}}
.modal-card h2{font-size:28px;font-weight:800;margin-top:10px;background:linear-gradient(135deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.modal-card p{color:var(--muted);margin-top:6px}
.modal-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}
.modal-stats div{background:var(--card-2);border-radius:14px;padding:10px 4px}
.modal-stats b{display:block;font-size:20px;font-weight:800}
.modal-stats span{font-size:11.5px;color:var(--muted)}
.modal-card .btn{width:100%;padding:13px}

.toast{position:fixed;top:72px;left:50%;transform:translate(-50%,-20px);z-index:70;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:all .3s;box-shadow:var(--shadow);max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:80}
.note{font-size:13px;color:var(--muted);margin-top:10px;text-align:center}

@media (max-width:420px){
  .chips.grid-4{grid-template-columns:repeat(2,1fr)}
  .muscles{grid-template-columns:1fr 128px}
  .sum-grid{grid-template-columns:1fr}
  .logo span{font-size:17px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<header class="app-head">
  <div class="wrap">
    <div class="logo">
      <div class="logo-mark"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M3 5h18"/><path d="M7 5v4M17 5v4"/><circle cx="12" cy="11" r="2"/><path d="M12 13v4M9 21l3-4 3 4M8 9l4 3 4-3"/></svg></div>
      <span>קליסתניקס</span>
    </div>
    <div class="streak" id="streakPill" title="ימי אימון ברצף">🔥 <span id="streakNum">0</span></div>
    <button class="icon-btn" id="themeBtn" aria-label="החלפת מצב כהה/בהיר"></button>
  </div>
</header>

<main class="wrap">
  <!-- WORKOUT VIEW -->
  <section class="view" id="view-workout">
    <div class="section">
      <div class="card" id="settings">
        <div class="field">
          <div class="label">🎯 מטרת אימון</div>
          <div class="chips grid-2" data-key="goal">
            <button class="chip" data-v="strength">כוח<small><bdi dir="ltr">3–6</bdi> חזרות · מנוחה <bdi dir="ltr">2–4</bdi> דק׳</small></button>
            <button class="chip" data-v="hypertrophy">היפרטרופיה<small><bdi dir="ltr">8–12</bdi> חזרות · <bdi dir="ltr">60–90</bdi> שנ׳</small></button>
            <button class="chip" data-v="endurance">סיבולת<small><bdi dir="ltr">15+</bdi> חזרות · <bdi dir="ltr">30–45</bdi> שנ׳</small></button>
            <button class="chip" data-v="mixed">משולב<small>כוח ← היפרטרופיה ← סיבולת</small></button>
          </div>
        </div>
        <div class="field">
          <div class="label">📈 רמה</div>
          <div class="chips grid-4" data-key="level">
            <button class="chip" data-v="1">מתחיל</button>
            <button class="chip" data-v="2">בינוני</button>
            <button class="chip" data-v="3">מתקדם</button>
            <button class="chip" data-v="4">מקצוען</button>
          </div>
        </div>
        <div class="field">
          <div class="label">💪 אזור גוף</div>
          <div class="chips" data-key="area" style="display:grid;grid-template-columns:repeat(3,1fr)">
            <button class="chip" data-v="upper">פלג עליון</button>

  return `<polygon class="${cls}" points="${a[0]}">${tip}</polygon>`;
}
function bodySVG(pri, sec, labels) {
  const cls = m => pri.has(m) ? 'mp' : sec.has(m) ? 'ms' : 'mb';
  const fig = (side, ox) => `<g transform="translate(${ox},0)">${SIL}${SHAPES[side].map(s => shapeEl(s, cls(s[0]))).join('')}</g>`;
  // RTL: front figure on the right, back on the left
  const lab = labels ? '<text x="190" y="262">מקדימה</text><text x="60" y="262">מאחורה</text>' : '';
  return `<svg class="body-svg" viewBox="0 0 250 ${labels ? 266 : 250}" role="img" aria-label="מפת שרירים: מקדימה ומאחורה">${fig('b', 0)}${fig('f', 130)}${lab}</svg>`;
}

/* =========================================================
   State
   ========================================================= */
const state = {
  s: Object.assign({ goal: 'hypertrophy', level: 1, area: 'full', equip: [], duration: 30 }, store.get('cg.settings', {})),
  w: store.get('cg.workout', null),
  hist: store.get('cg.history', []),
  favs: store.get('cg.favs', [])
};
const saveW = () => store.set('cg.workout', state.w);

/* =========================================================
   Generator
   ========================================================= */
function eqOK(eq, avail) {
  if (!eq) return true;
  return eq.split('|').some(g => g === '' || g.split('+').every(x => avail.includes(x)));
}
// Eligible exercises; for each skill family keep only the most advanced stage(s) the level allows
function buildPool(s, cats) {
  const L = s.level, fam = {}, out = [];
  for (const e of EX) {
    if (!cats.includes(e.cat) || e.min > L || !eqOK(e.eq, s.equip)) continue;
    if (e.f) (fam[e.f] = fam[e.f] || []).push(e); else out.push(e);
  }
  for (const k in fam) {
    const top = Math.max(...fam[k].map(e => e.min));
    out.push(...fam[k].filter(e => e.min === top));
  }
  return out;
}
const tier = e => e.s ? 0 : e.cat === 'core' ? 3 : e.iso ? 2 : 1;

function pickFrom(cands, chosen, L) {
  const priCount = {};
  chosen.forEach(e => priCount[e.pri] = (priCount[e.pri] || 0) + 1);
  const skills = chosen.filter(e => e.s).length;
  let best = null, bs = -1e9;
  for (const e of cands) {
    let sc = Math.random() * 1.6;
    sc += e.max >= L ? 3 : -(L - e.max) * 1.5;      // prefer level-appropriate
    sc -= (priCount[e.pri] || 0) * 1.2;               // prefer variety of muscles
    if (e.s) sc += L >= 3 ? (skills < 2 ? 1.6 : -0.4) : L === 2 ? 0.3 : 0;
    if (e.iso) sc -= 0.4;
    if (sc > bs) { bs = sc; best = e; }
  }
  return best;
}
function available(pool, chosen, cat) {
  const ids = new Set(chosen.map(e => e.id)), fams = new Set(chosen.map(e => e.f).filter(Boolean));
  return pool.filter(e => (!cat || e.cat === cat) && !ids.has(e.id) && !(e.f && fams.has(e.f)));
}

function setsFor(k, s) { let n = SCHEMES[k].sets[s.duration]; if (s.level === 1) n--; return Math.max(2, n); }
function prescribe(e, k, s) {
  const key = e.s ? 'strength' : k;          // skills are always trained in a strength scheme
  const sc = SCHEMES[key];
  const val = e.t === 'h' ? (e.s ? sc.skillHold || '5–10' : sc.hold) : sc.reps;
  return { k: key, sets: setsFor(key, s), val, unit: e.t === 'h' ? 'שניות' : 'חזרות', rest: sc.rest };
}
function slotScheme(goal, i, n) {
  if (goal !== 'mixed') return goal;
  const f = i / n;
  return f < 1 / 3 ? 'strength' : f < 2 / 3 ? 'hypertrophy' : 'endurance';
}
const warmCount = d => d <= 15 ? 3 : d >= 60 ? 5 : 4;
const slotSeconds = p => p.sets * SCHEMES[p.k].work + (p.sets - 1) * p.rest + 45;
const mainBudget = s => s.duration * 60 - warmCount(s.duration) * 2 * 45;

function pickList(list, s, count, cardioFirst) {
  const ok = list.filter(x => (x.ar[0] === '*' || x.ar.includes(s.area)) && eqOK(x.eq, s.equip));
  let out = [];
  if (cardioFirst) {
    const cardio = ok.filter(x => x.cardio);
    out.push(rand(cardio));
    out = out.concat(shuffle(ok.filter(x => !x.cardio)).slice(0, count - 1));
  } else out = shuffle(ok).slice(0, count);
  return out.map(x => ({ n: x.n, a: x.a, d: x.d, done: false }));
}

function generate() {
  const s = state.s, L = s.level, area = AREAS[s.area];
  const pool = buildPool(s, area.cats);
  // Fill the time budget (mixed goal estimated with the average of the three schemes)
  const budget = mainBudget(s);
  const chosen = [];
  let used = 0, short = false;
  for (let i = 0; chosen.length < 14 && i < 60; i++) {
    const cat = area.rot[i % area.rot.length];
    let c = available(pool, chosen, cat);
    if (!c.length) c = available(pool, chosen, null);
    if (!c.length) { short = true; break; }
    const e = pickFrom(c, chosen, L);
    const t = s.goal === 'mixed'
      ? ['strength', 'hypertrophy', 'endurance'].reduce((a, k) => a + slotSeconds(prescribe(e, k, s)), 0) / 3
      : slotSeconds(prescribe(e, s.goal, s));
    if (chosen.length >= 2 && used + t > budget * 1.1) break;
    chosen.push(e);
    used += t;
  }
  // Order: skills → compound → accessories → core (stable)
  chosen.sort((a, b) => tier(a) - tier(b));
  const main = chosen.map((e, i) => Object.assign({ id: e.id, done: [] }, prescribe(e, slotScheme(s.goal, i, chosen.length), s)));
  // Small pool (few exercises fit the settings)? Fill the time with extra sets
  let total = main.reduce((a, m) => a + slotSeconds(m), 0);
  for (let g = 0; total < budget * 0.9 && g < 60; g++) {
    const m = main[g % main.length];
    if (m.sets >= 6) continue;
    m.sets++;
    total = main.reduce((a, x) => a + slotSeconds(x), 0);
  }
  main.forEach(m => m.done = Array(m.sets).fill(false));
  state.w = {
    id: uid(), created: Date.now(), s: Object.assign({}, s, { equip: s.equip.slice() }),
    warm: pickList(WARM, s, warmCount(s.duration), true),
    main,
    cool: pickList(STRETCH, s, warmCount(s.duration), false),
    logged: false, favId: null, startedAt: null, short: short && total < budget * 0.8
  };
  saveW();
}

function swapExercise(i) {
  const w = state.w, slot = w.main[i], cur = EXM[slot.id];
  const s = w.s;
  const pool = buildPool(s, ['push', 'pull', 'legs', 'core', 'full']);
  const others = w.main.filter((_, j) => j !== i).map(m => EXM[m.id]);
  const cands = available(pool, others, null).filter(e => e.id !== cur.id);
  const tiers = [
    cands.filter(e => e.pri === cur.pri),
    cands.filter(e => e.sec.includes(cur.pri) || cur.sec.includes(e.pri)),
    cands.filter(e => e.cat === cur.cat)
  ];
  const list = tiers.find(t => t.length);
  if (!list) { toast('לא נמצא תרגיל חלופי מתאים 🤔'); return false; }
  const inRange = list.filter(e => e.max >= s.level);
  const next = rand(inRange.length ? inRange : list);
  const schemeKey = s.goal === 'mixed' ? slotScheme('mixed', i, w.main.length) : s.goal;
  const p = prescribe(next, schemeKey, s);
  w.main[i] = Object.assign({ id: next.id }, p, { done: Array(p.sets).fill(false) });
  saveW();
  return true;
}

/* =========================================================
   Rendering – workout
   ========================================================= */
const ICON = {
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  swap: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4L3 8l4 4"/><path d="M3 8h13a5 5 0 0 1 0 10h-2"/></svg>',
  star: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z"/></svg>',
  flag: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>',
  sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>'
};

function totals() {
  const w = state.w;
  if (!w) return { done: 0, total: 0 };
  let done = 0, total = 0;
  w.warm.concat(w.cool).forEach(x => { total++; if (x.done) done++; });
  w.main.forEach(m => m.done.forEach(d => { total++; if (d) done++; }));
  return { done, total };
}
function estMinutes(w) {
  let sec = (w.warm.length + w.cool.length) * 45;
  w.main.forEach(m => { sec += slotSeconds(m); });
  return Math.round(sec / 60);
}
function wName(s) { return `${GOALS[s.goal]} · ${AREAS[s.area].name} · ${s.duration} דק׳`; }

function checkRow(x, phase, i) {
  return `<div class="check-row ${x.done ? 'done' : ''}" data-act="check" data-phase="${phase}" data-i="${i}">
    <div class="cbox">${ICON.check}</div>
    <div class="cr-body"><div class="cr-name">${esc(x.n)}</div><div class="cr-desc">${esc(x.d)}</div></div>
    <div class="cr-amt">${esc(x.a)}</div></div>`;
}

function exCard(m, i, cls = '') {
  const e = EXM[m.id];
  const goal = state.w.s.goal;
  const tags = [];
  if (e.s) tags.push('<span class="tag skill">סקיל</span>');
  if (goal === 'mixed' || m.k !== goal) tags.push(`<span class="tag k-${m.k}">${SCHEMES[m.k].name}</span>`);
  tags.push(`<span class="tag">${e.t === 'h' ? 'סטטי' : 'דינמי'}</span>`);
  const complete = m.done.every(Boolean);
  const secTxt = e.sec.length ? e.sec.map(x => MUSCLES[x]).join(', ') : '—';
  const sets = m.done.map((d, j) => `<button class="set ${d ? 'done' : ''}" data-act="set" data-i="${i}" data-j="${j}">${ICON.check}סט ${j + 1}</button>`).join('');
  return `<article class="card ex ${complete ? 'complete' : ''} ${cls}" data-card="${i}" style="--d:${120 + i * 70}ms">
    <div class="ex-head">
      <div class="ex-num">${i + 1}</div>
      <div class="ex-title"><h3>${esc(e.name)}</h3><div class="tags">${tags.join('')}</div></div>
      <button class="swap-btn" data-act="swap" data-i="${i}" aria-label="החלף תרגיל">${ICON.swap}החלף</button>
    </div>
    <div class="stats">
      <div class="stat"><b>${m.sets}</b><span>סטים</span></div>
      <div class="stat"><b>${m.val}</b><span>${m.unit}${e.side ? ' לכל צד' : ''}</span></div>
      <button class="stat" data-act="rest" data-i="${i}" title="הפעל טיימר מנוחה"><b>${fmt(m.rest)}</b><span>מנוחה</span></button>
    </div>
    <p class="desc">${esc(e.desc)}</p>
    <div class="muscles">
      <div>
        <div class="mus-line"><span class="dot pri"></span><span class="k">שריר ראשי:</span><b>${MUSCLES[e.pri]}</b></div>
        <div class="mus-line"><span class="dot sec"></span><span class="k">משניים:</span><span>${secTxt}</span></div>
      </div>
      <div>${bodySVG(new Set([e.pri]), new Set(e.sec))}</div>
    </div>
    <div class="sets">${sets}</div>
  </article>`;
}

function summaryCard() {
  const pri = {}, sec = {};
  state.w.main.forEach(m => {
    const e = EXM[m.id];
    pri[e.pri] = (pri[e.pri] || 0) + 1;
    e.sec.forEach(x => sec[x] = (sec[x] || 0) + 1);
  });
  const priSet = new Set(Object.keys(pri));
  const secSet = new Set(Object.keys(sec).filter(x => !priSet.has(x)));
  const all = new Set([...priSet, ...secSet]);
  const chips = [...priSet].sort((a, b) => pri[b] - pri[a]).map(m => `<span class="mchip"><span class="dot pri"></span>${MUSCLES[m]} <b><bdi dir="ltr">×${pri[m]}</bdi></b></span>`)
    .concat([...secSet].sort((a, b) => sec[b] - sec[a]).map(m => `<span class="mchip"><span class="dot sec"></span>${MUSCLES[m]}</span>`)).join('');
  const missing = Object.keys(MUSCLES).filter(m => !all.has(m)).map(m => MUSCLES[m]);
  return `<div class="card enter" style="--d:${200 + state.w.main.length * 70}ms">
    <div class="h2" style="margin-bottom:12px">📊 סיכום שרירים</div>
    <div class="sum-grid">
      <div class="sum-map">${bodySVG(priSet, secSet, true)}</div>
      <div>
        <div class="big-num">${all.size}<span style="font-size:16px;color:var(--muted);font-weight:600"> / ${Object.keys(MUSCLES).length}</span></div>
        <div style="color:var(--muted);font-size:13.5px;margin-bottom:10px">קבוצות שרירים באימון</div>
        <div class="mchips">${chips}</div>
      </div>
    </div>
    <div class="legend"><span><span class="dot pri"></span>שריר ראשי (מספר תרגילים)</span><span><span class="dot sec"></span>שריר משני</span></div>
    ${missing.length && missing.length < 10 ? `<p class="note" style="text-align:right">לא עובדים היום: ${missing.join(', ')}</p>` : ''}
  </div>`;
}

function renderWorkout(animate) {
  const el = $('#workout'), w = state.w;
  if (!w) {
    el.innerHTML = `<div class="card empty"><div class="em">🤸‍♂️</div><h3>מוכן להתאמן?</h3><p>בחר הגדרות ולחץ על "צור אימון" כדי לקבל אימון מותאם אישית.</p></div>`;
    return;
  }
  const a = animate ? 'enter' : '';
  const isFav = w.favId && state.favs.some(f => f.id === w.favId);
  const t = totals();
  el.innerHTML = `
  <div class="wk-head ${a}">
    <div class="wk-top">
      <div class="wk-title">
        <h2>האימון שלך</h2>
        <div class="meta">
          <span class="pill">🎯 ${GOALS[w.s.goal]}</span><span class="pill">📈 ${LEVELS[w.s.level]}</span>
          <span class="pill">💪 ${AREAS[w.s.area].name}</span><span class="pill">⏱️ ≈${estMinutes(w)} דק׳</span>
        </div>
      </div>
      <button class="icon-btn fav-btn ${isFav ? 'on' : ''}" data-act="fav" aria-label="שמור במועדפים">${ICON.star}</button>
    </div>
    <div class="wk-actions">
      <button class="btn" data-act="finish">${ICON.flag}סיים אימון</button>
    </div>
  </div>
  <div class="progress ${a}"><div class="bar"><i id="pbar"></i></div><div class="pct" id="pct">0%</div></div>
  ${w.short ? `<p class="note">💡 לא נמצאו מספיק תרגילים מתאימים לציוד שבחרת – נסה להוסיף ציוד או לבחור אזור אחר.</p>` : ''}
  <div class="phase ${a}" style="--d:60ms"><span class="em">🔥</span>חימום<small>${w.warm.length} תרגילים</small></div>
  <div class="card ${a}" style="--d:90ms">${w.warm.map((x, i) => checkRow(x, 'warm', i)).join('')}</div>
  <div class="phase ${a}" style="--d:110ms"><span class="em">💪</span>האימון<small>${w.main.length} תרגילים</small></div>
  <div id="mainList">${w.main.map((m, i) => exCard(m, i, a)).join('')}</div>
  <div class="phase ${a}" style="--d:${150 + w.main.length * 70}ms"><span class="em">🧘</span>מתיחות<small>${w.cool.length} תרגילים</small></div>
  <div class="card ${a}" style="--d:${170 + w.main.length * 70}ms">${w.cool.map((x, i) => checkRow(x, 'cool', i)).join('')}</div>
  ${summaryCard().replace('class="card enter"', `class="card ${a}"`)}`;
  updateProgress(t);
}

function updateProgress(t = totals()) {
  const p = t.total ? Math.round(t.done / t.total * 100) : 0;
  const bar = $('#pbar'), pct = $('#pct');
  if (bar) requestAnimationFrame(() => { bar.style.width = p + '%'; });
  if (pct) pct.textContent = p + '%';
  return p;
}

/* =========================================================
   Interactions – workout
   ========================================================= */
$('#workout').addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || !state.w) return;
  const w = state.w, act = b.dataset.act;
  if (act === 'set') {
    const i = +b.dataset.i, j = +b.dataset.j, m = w.main[i];
    m.done[j] = !m.done[j];
    if (!w.startedAt) w.startedAt = Date.now();
    b.classList.toggle('done', m.done[j]);
    $(`[data-card="${i}"]`).classList.toggle('complete', m.done.every(Boolean));
    saveW();
    const p = updateProgress();
    if (m.done[j]) {
      if (p >= 100) finishWorkout(true);
      else startTimer(m.rest, nextLabel(i, j));
    }
  } else if (act === 'check') {
    const arr = w[b.dataset.phase], x = arr[+b.dataset.i];
    x.done = !x.done;
    if (!w.startedAt) w.startedAt = Date.now();
    b.classList.toggle('done', x.done);
    saveW();
    if (updateProgress() >= 100 && x.done) finishWorkout(true);
  } else if (act === 'swap') {
    const i = +b.dataset.i;
    if (swapExercise(i)) {
      const old = $(`[data-card="${i}"]`);
      const tmp = document.createElement('div');
      tmp.innerHTML = exCard(w.main[i], i, 'swap-in');
      old.replaceWith(tmp.firstElementChild);
      refreshSummary();
      updateProgress();
      toast('התרגיל הוחלף ✨');
    }
  } else if (act === 'rest') {
    const m = w.main[+b.dataset.i];
    startTimer(m.rest, EXM[m.id].name);
  } else if (act === 'fav') {
    toggleFav(b);
  } else if (act === 'finish') {
    const t = totals();
    if (t.done === 0) { if (confirm('עוד לא סימנת אף סט. למחוק את האימון?')) { state.w = null; saveW(); renderWorkout(); } return; }
    if (confirm('לסיים את האימון עכשיו ולשמור אותו בהיסטוריה?')) finishWorkout(false);
  }
});

function refreshSummary() {
  const cards = $$('#workout > .card');
  const last = cards[cards.length - 1];
  const tmp = document.createElement('div');
  tmp.innerHTML = summaryCard().replace('class="card enter"', 'class="card"');
  last.replaceWith(tmp.firstElementChild);
}

function nextLabel(i, j) {
  const w = state.w, m = w.main[i];
  const nextSet = m.done.findIndex(d => !d);
  if (nextSet !== -1) return `הבא: סט ${nextSet + 1} · ${EXM[m.id].name}`;
  const nx = w.main.findIndex(mm => mm.done.some(d => !d));
  return nx !== -1 ? `הבא: ${EXM[w.main[nx].id].name}` : 'הבא: מתיחות 🧘';
}

function finishWorkout(full) {
  const w = state.w;
  stopTimer();
  const t = totals();
  const pct = t.total ? Math.round(t.done / t.total * 100) : 0;
  const mins = w.startedAt ? Math.max(1, Math.round((Date.now() - w.startedAt) / 60000)) : w.s.duration;
  const setsDone = w.main.reduce((a, m) => a + m.done.filter(Boolean).length, 0);
  if (!w.logged) {
    state.hist.unshift({ id: w.id, date: new Date().toISOString(), goal: w.s.goal, level: w.s.level, area: w.s.area, duration: w.s.duration, actual: mins, pct, exercises: w.main.length });
    store.set('cg.history', state.hist);
    w.logged = true;
    saveW();
  } else {
    const h = state.hist.find(h => h.id === w.id);
    if (h) { h.pct = pct; h.actual = mins; store.set('cg.history', state.hist); }
  }
  renderStreak();
  renderHistory();
  const st = streakInfo();
  $('#doneMsg').textContent = full ? 'סיימת את כל האימון! הגוף שלך מודה לך 💪' : `השלמת ${pct}% מהאימון – כל אימון נחשב!`;
  $('#doneStats').innerHTML = `<div><b>${mins}</b><span>דקות</span></div><div><b>${setsDone}</b><span>סטים</span></div><div><b>🔥 ${st.cur}</b><span>ימים ברצף</span></div>`;
  $('#doneModal').classList.add('show');
  confetti();
  playTone([523, 659, 784, 1047], 0.13);
}
$('#doneClose').addEventListener('click', () => $('#doneModal').classList.remove('show'));
$('#doneModal').addEventListener('click', e => { if (e.target.id === 'doneModal') e.currentTarget.classList.remove('show'); });

/* =========================================================
   Favorites
   ========================================================= */
function toggleFav(btn) {
  const w = state.w;
  const idx = w.favId ? state.favs.findIndex(f => f.id === w.favId) : -1;
  if (idx !== -1) {
    state.favs.splice(idx, 1);
    w.favId = null;
    btn.classList.remove('on');
    toast('הוסר מהמועדפים');
  } else {
    const id = uid();
    state.favs.unshift({
      id, name: wName(w.s), savedAt: Date.now(),
      data: {
        s: w.s,
        warm: w.warm.map(x => ({ n: x.n, a: x.a, d: x.d })),
        main: w.main.map(m => ({ id: m.id, k: m.k, sets: m.sets, val: m.val, unit: m.unit, rest: m.rest })),
        cool: w.cool.map(x => ({ n: x.n, a: x.a, d: x.d }))
      }
    });
    w.favId = id;
    btn.classList.add('on');
    btn.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.35) rotate(20deg)' }, { transform: 'scale(1)' }], { duration: 400 });
    toast('נשמר במועדפים ⭐');
  }
  store.set('cg.favs', state.favs);
  saveW();
  renderFavs();
}
function loadFav(id) {
  const f = state.favs.find(f => f.id === id);
  if (!f) return;
  if (state.w && !state.w.logged && totals().done > 0 && !confirm('יש אימון פעיל. להחליף אותו באימון המועדף?')) return;
  const d = f.data;
  state.w = {
    id: uid(), created: Date.now(), s: d.s,
    warm: d.warm.map(x => Object.assign({}, x, { done: false })),
    main: d.main.filter(m => EXM[m.id]).map(m => Object.assign({}, m, { done: Array(m.sets).fill(false) })),
    cool: d.cool.map(x => Object.assign({}, x, { done: false })),
    logged: false, favId: f.id, startedAt: null
  };
  saveW();
  switchView('workout');
  renderWorkout(true);
  setTimeout(() => $('#workout').scrollIntoView({ behavior: 'smooth', block: 'start' }), 50);
}
function renderFavs() {
  const el = $('#favList');
  if (!state.favs.length) {
    el.innerHTML = `<div class="card empty"><div class="em">⭐</div><h3>אין עדיין מועדפים</h3><p>לחץ על הכוכב באימון שאהבת כדי לשמור אותו כאן.</p></div>`;
    return;
  }
  el.innerHTML = state.favs.map(f => {
    const names = f.data.main.slice(0, 3).map(m => EXM[m.id] ? EXM[m.id].name : '').filter(Boolean).join(' · ');
    return `<div class="card item">
      <div class="item-ic">⭐</div>
      <div class="item-body">
        <div class="item-title">${esc(f.name)}</div>
        <div class="item-sub">${LEVELS[f.data.s.level]} · ${f.data.main.length} תרגילים · נשמר ${new Date(f.savedAt).toLocaleDateString('he-IL')}</div>
        <div class="item-sub" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(names)}</div>
      </div>
      <div class="list-actions">
        <button class="btn primary" data-load="${f.id}">טען</button>
        <button class="btn ghost danger" data-del="${f.id}" aria-label="מחק">✕</button>
      </div></div>`;
  }).join('');
}
$('#favList').addEventListener('click', e => {
  const l = e.target.closest('[data-load]'), d = e.target.closest('[data-del]');
  if (l) loadFav(l.dataset.load);
  if (d && confirm('למחוק את האימון מהמועדפים?')) {
    state.favs = state.favs.filter(f => f.id !== d.dataset.del);
    store.set('cg.favs', state.favs);
    if (state.w && state.w.favId === d.dataset.del) { state.w.favId = null; saveW(); }
    renderFavs();
    const fb = $('.fav-btn'); if (fb && state.w && !state.w.favId) fb.classList.remove('on');
  }
});

/* =========================================================
   History & streak
   ========================================================= */
function streakInfo() {
  const days = new Set(state.hist.map(h => dayKey(new Date(h.date))));
  let cur = 0;
  const d = new Date();
  if (!days.has(dayKey(d))) d.setDate(d.getDate() - 1);
  while (days.has(dayKey(d))) { cur++; d.setDate(d.getDate() - 1); }
  let best = 0, run = 0, prev = null;
  [...days].sort().forEach(k => {
    const dt = new Date(k + 'T12:00:00');
    run = prev && Math.round((dt - prev) / 864e5) === 1 ? run + 1 : 1;
    best = Math.max(best, run);
    prev = dt;
  });
  return { cur, best, days: days.size };
}
function renderStreak() {
  const st = streakInfo();
  $('#streakNum').textContent = st.cur;
  $('#streakPill').title = `${st.cur} ימי אימון ברצף`;
}
function renderHistory() {
  const st = streakInfo();
  $('#histStats').innerHTML = `
    <div class="kpi"><b>🔥 ${st.cur}</b><span>ימים ברצף</span></div>
    <div class="kpi"><b>${st.best}</b><span>שיא רצף</span></div>
    <div class="kpi"><b>${state.hist.length}</b><span>סה״כ אימונים</span></div>`;
  const el = $('#histList');
  $('#clearHist').hidden = !state.hist.length;
  if (!state.hist.length) {
    el.innerHTML = `<div class="card empty"><div class="em">📅</div><h3>עדיין אין אימונים</h3><p>כל אימון שתסיים יופיע כאן, יחד עם מונה ימי הרצף שלך.</p></div>`;
    return;
  }
  el.innerHTML = state.hist.map(h => {
    const d = new Date(h.date);
    const date = d.toLocaleDateString('he-IL', { weekday: 'short', day: 'numeric', month: 'short' });
    const time = d.toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' });
    const em = { strength: '🏋️', hypertrophy: '💪', endurance: '🏃', mixed: '⚡' }[h.goal] || '💪';
    return `<div class="card item">
      <div class="item-ic">${em}</div>
      <div class="item-body">
        <div class="item-title">${GOALS[h.goal]} · ${AREAS[h.area] ? AREAS[h.area].name : ''}</div>
        <div class="item-sub">${date} · ${time}</div>
        <div class="item-sub">${LEVELS[h.level]} · ${h.duration} דק׳ מתוכנן${h.actual ? ` · ${h.actual} דק׳ בפועל` : ''}</div>
      </div>
      <span class="badge ${h.pct < 100 ? 'part' : ''}">${h.pct >= 100 ? '✓ הושלם' : h.pct + '%'}</span>
    </div>`;
  }).join('');
}
$('#clearHist').addEventListener('click', () => {
  if (!confirm('למחוק את כל היסטוריית האימונים? (גם מונה הרצף יתאפס)')) return;
  state.hist = [];
  store.set('cg.history', state.hist);
  renderHistory(); renderStreak();
});

/* =========================================================
   Rest timer
   ========================================================= */
const T = { end: 0, total: 0, left: 0, paused: false, iv: null, lastBeep: null, ended: false };
const CIRC = 2 * Math.PI * 42;
function startTimer(sec, next) {
  ensureAudio();
  clearInterval(T.iv);
  Object.assign(T, { total: sec, end: Date.now() + sec * 1000, paused: false, ended: false, lastBeep: null });
  $('#tLabel').textContent = 'מנוחה';
  $('#tNext').textContent = next || '';
  $('#tPause').textContent = '⏸';
  $('#timer').classList.remove('ended');
  $('#timer').classList.add('show');
  $('#timerFab').style.display = 'none';
  tick();
  T.iv = setInterval(tick, 200);
}
function remaining() { return T.paused ? T.left : Math.max(0, (T.end - Date.now()) / 1000); }
function tick() {
  const left = remaining();
  $('#tTime').textContent = fmt(left);
  $('#tFg').style.strokeDashoffset = CIRC * (1 - (T.total ? left / T.total : 0));
  const s = Math.ceil(left);
  if (!T.paused && s <= 3 && s > 0 && T.lastBeep !== s) { T.lastBeep = s; playTone([660], 0.08, 0.15); }
  if (left <= 0 && !T.ended) {
    T.ended = true;
    clearInterval(T.iv);
    $('#tLabel').textContent = 'יאללה, לסט הבא! 💪';
    $('#timer').classList.add('ended');
    playTone([880, 880, 1320], 0.22, 0.4);
    if (navigator.vibrate) navigator.vibrate([250, 120, 250, 120, 400]);
    setTimeout(() => { if (T.ended) stopTimer(); }, 4000);
  }
}
function stopTimer() {
  clearInterval(T.iv);
  T.ended = false;
  $('#timer').classList.remove('show');
  $('#timerFab').style.display = '';
}
function adjustTimer(d) {
  if (T.ended) { startTimer(Math.max(5, d), $('#tNext').textContent); return; }
  if (T.paused) T.left = Math.max(0, T.left + d);
  else T.end = Math.max(Date.now(), T.end + d * 1000);
  T.total = Math.max(T.total, remaining());
  T.lastBeep = null;
  tick();
}
$('#timer').addEventListener('click', e => {
  const b = e.target.closest('[data-t]');
  if (!b) return;
  const a = b.dataset.t;
  if (a === '-15') adjustTimer(-15);
  else if (a === '+15') adjustTimer(15);
  else if (a === 'skip' || a === 'close') stopTimer();
  else if (a === 'pause') {
    if (T.ended) return;
    if (T.paused) { T.end = Date.now() + T.left * 1000; T.paused = false; b.textContent = '⏸'; T.iv = setInterval(tick, 200); }
    else { T.left = remaining(); T.paused = true; b.textContent = '▶'; clearInterval(T.iv); }
    tick();
  }
});
$('#tTime').addEventListener('click', () => {
  const v = prompt('כמה שניות מנוחה?', Math.round(remaining()) || 90);
  const n = parseInt(v, 10);
  if (n > 0) startTimer(Math.min(n, 3600), $('#tNext').textContent);
});
$('#timerFab').addEventListener('click', () => {
  const k = state.w ? (state.w.s.goal === 'mixed' ? 'hypertrophy' : state.w.s.goal) : (state.s.goal === 'mixed' ? 'hypertrophy' : state.s.goal);
  startTimer(SCHEMES[k].rest, 'טיימר ידני – אפשר לשנות עם ‎+15/−15‎ או בהקשה על הזמן');
});

/* Audio */
let actx = null;
function ensureAudio() {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
  } catch (e) {}
}
function playTone(freqs, dur = 0.15, vol = 0.3) {
  ensureAudio();
  if (!actx) return;
  const t0 = actx.currentTime + 0.02;
  freqs.forEach((f, i) => {
    const o = actx.createOscillator(), g = actx.createGain();
    const t = t0 + i * (dur + 0.06);
    o.type = 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t + dur + 0.02);
  });
}
document.addEventListener('pointerdown', ensureAudio, { once: true });

/* =========================================================
   Settings UI
   ========================================================= */
function renderSettings() {
  $$('#settings .chips').forEach(g => {
    const key = g.dataset.key;
    $$('.chip', g).forEach(c => {
      const v = c.dataset.v;
      let on;
      if (key === 'equip') on = v === 'none' ? !state.s.equip.length : state.s.equip.includes(v);
      else on = String(state.s[key]) === v;
      c.classList.toggle('on', on);
    });
  });
}
$('#settings').addEventListener('click', e => {
  const c = e.target.closest('.chip');
  if (!c) return;
  const key = c.closest('.chips').dataset.key, v = c.dataset.v;
  if (key === 'equip') {
    if (v === 'none') state.s.equip = [];
    else {
      const i = state.s.equip.indexOf(v);
      if (i === -1) state.s.equip.push(v); else state.s.equip.splice(i, 1);
    }
  } else state.s[key] = (key === 'level' || key === 'duration') ? +v : v;
  store.set('cg.settings', state.s);
  renderSettings();
});
$('#genBtn').addEventListener('click', () => {
  if (state.w && !state.w.logged && totals().done > 0 && !confirm('יש אימון בתהליך. ליצור אימון חדש במקומו?')) return;
  stopTimer();
  const b = $('#genBtn');
  b.classList.remove('spin'); void b.offsetWidth; b.classList.add('spin');
  generate();
  renderWorkout(true);
  setTimeout(() => {
    const top = $('#workout').getBoundingClientRect().top + scrollY - 70;
    scrollTo({ top, behavior: 'smooth' });
  }, 80);
});

/* =========================================================
   Theme, nav, toast, confetti
   ========================================================= */
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  $('#themeBtn').innerHTML = t === 'dark' ? ICON.sun : ICON.moon;
  document.querySelector('meta[name="theme-color"]').content = t === 'dark' ? '#0d1016' : '#f4f5f9';
}
let theme = store.get('cg.theme', null) || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
applyTheme(theme);
$('#themeBtn').addEventListener('click', () => {
  theme = theme === 'dark' ? 'light' : 'dark';
  store.set('cg.theme', theme);
  applyTheme(theme);
  $('#themeBtn').animate([{ transform: 'rotate(-90deg) scale(.6)' }, { transform: 'none' }], { duration: 350, easing: 'ease-out' });
});

function switchView(v) {
  $$('.nav button').forEach(b => b.classList.toggle('on', b.dataset.view === v));
  $$('.view').forEach(s => s.hidden = s.id !== 'view-' + v);
  if (v === 'history') renderHistory();
  if (v === 'favs') renderFavs();
  scrollTo({ top: 0 });
}
$$('.nav button').forEach(b => b.addEventListener('click', () => switchView(b.dataset.view)));

let toastT;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove('show'), 1800);
}

function confetti() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = $('#confetti'), ctx = c.getContext('2d'), dpr = devicePixelRatio || 1;
  const W = innerWidth, H = innerHeight;
  c.width = W * dpr; c.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const colors = ['#ff5a1f', '#ffb020', '#22c55e', '#3b82f6', '#a855f7', '#ef4444', '#06b6d4'];
  const P = Array.from({ length: 180 }, () => ({
    x: W / 2 + (Math.random() - .5) * 60, y: H * .38,
    vx: (Math.random() - .5) * 16, vy: -Math.random() * 15 - 5,
    s: Math.random() * 7 + 5, r: Math.random() * 6, vr: (Math.random() - .5) * .35,
    c: rand(colors)
  }));
  const t0 = performance.now(), DUR = 3400;
  (function frame(now) {
    const el = now - t0;
    ctx.clearRect(0, 0, W, H);
    for (const p of P) {
      p.vy += .32; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
      ctx.globalAlpha = Math.max(0, 1 - el / DUR);
      ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
      ctx.restore();
    }
    if (el < DUR) requestAnimationFrame(frame); else ctx.clearRect(0, 0, W, H);
  })(t0);
}

/* =========================================================
   Init
   ========================================================= */
if (state.w && (!state.w.main || state.w.main.some(m => !EXM[m.id]))) state.w = null;
renderSettings();
renderWorkout(false);
renderStreak();
renderHistory();
renderFavs();
</script>
